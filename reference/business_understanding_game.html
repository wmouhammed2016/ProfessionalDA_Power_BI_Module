<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Understanding Detective</title>
<!-- Poppins is loaded from Google Fonts when online; the page falls back to system fonts when offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   THEME  (colors sampled from the "Data-Driven Insights" lecture slides)
   ========================================================================== */
:root{
  --bg:#F2F0EC;          /* slide cream */
  --surface:#FFFFFF;
  --ink:#222222;         /* slide charcoal */
  --muted:#5A5A5A;
  --line:#DDD9D1;
  --violet:#8236FF;      /* slide violet */
  --violet-d:#6A1FE0;
  --violet-t:#F0E8FF;
  --orange:#FF4A11;      /* slide orange */
  --orange-d:#B93409;    /* darker orange for text on light backgrounds */
  --orange-t:#FFEBE3;
  --green:#1E8E5A; --green-d:#166B43; --green-t:#E2F4EB;
  --blue:#1D6FE0;  --blue-d:#1558B8;  --blue-t:#E4EEFD;
  --amber:#B7791F; --amber-d:#8A5A12; --amber-t:#FBF0DC;
  --grey:#6B6B6B;  --grey-d:#4A4A4A;  --grey-t:#ECEAE5;
  --red-d:#B42318; --red-t:#FDECEA;
  --radius:18px;
  --shadow:0 1px 2px rgba(34,34,34,.06),0 8px 24px rgba(34,34,34,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:1.0625rem;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{line-height:1.2;margin:0 0 .5em;font-weight:700;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800}
h2{font-size:1.45rem}
h3{font-size:1.1rem}
p{margin:0 0 .8em}
a{color:var(--violet-d)}
.muted{color:var(--muted)}
.small{font-size:.9rem}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:6px}
h1:focus,h2:focus{outline:none}
.wrap{max-width:1060px;margin:0 auto;padding:0 16px}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{left:8px}

/* Top bar ----------------------------------------------------------------- */
.top{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
.brand .dot{width:14px;height:14px;border-radius:50%;background:var(--violet);box-shadow:10px 0 0 var(--orange);margin-right:14px;flex:none}
.brand span.sub{font-weight:500;color:var(--muted);font-size:.85rem;margin-left:12px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.timer{display:flex;align-items:center;gap:4px;background:var(--ink);color:#fff;border-radius:999px;padding:4px 6px 4px 14px;font-weight:600}
.timer .t{font-variant-numeric:tabular-nums;font-size:1.05rem;min-width:3.4em}
.timer button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;padding:5px 12px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer}
.timer button:hover{background:rgba(255,255,255,.26)}
.timer.warn{background:var(--orange);color:var(--ink)}
.timer.warn button{background:rgba(34,34,34,.14);color:var(--ink)}
.timer.warn button:hover{background:rgba(34,34,34,.26)}
.saved{font-size:.78rem;color:var(--muted)}
.banner{background:var(--orange);color:var(--ink);font-weight:600}
.banner .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-top:10px;padding-bottom:10px}

/* Toolbar (breadcrumbs / back) ------------------------------------------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:14px 0 6px;min-height:22px}
.crumbs{font-size:.85rem;color:var(--muted)}
.crumbs a{color:var(--muted)}
.crumbs b{color:var(--ink);font-weight:600}

/* Buttons ---------------------------------------------------------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:.95rem;padding:9px 18px;border-radius:999px;cursor:pointer;text-decoration:none;transition:transform .08s,background .15s}
.btn:hover{background:var(--grey-t)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.primary:hover{background:var(--violet-d);border-color:var(--violet-d)}
.btn.danger{border-color:var(--red-d);color:var(--red-d)}
.btn.danger:hover{background:var(--red-t)}
.btn.ghost{border-color:var(--line);background:transparent}
.btn.ghost:hover{background:var(--surface)}
.btn.sm{padding:5px 12px;font-size:.82rem}
.btn[disabled],.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.btn.fac-on{background:var(--violet-t);border-color:var(--violet);color:var(--violet-d)}

/* Cards / layout ---------------------------------------------------------- */
main{padding:6px 0 60px;outline:none}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;margin:0 0 18px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.grid .card{margin:0}
.lead{font-size:1.08rem}
.hero{padding:26px 0 8px;text-align:center}
.hero .pill{display:inline-block;background:var(--surface);border-radius:999px;padding:14px 44px;box-shadow:var(--shadow);margin-bottom:12px}
.hero .pill h1{margin:0}
.hero p{color:var(--muted);margin:0}
.chip{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border-radius:999px;padding:2px 10px;background:var(--grey-t);color:var(--grey-d)}
.chip.violet{background:var(--violet-t);color:var(--violet-d)}
.chip.orange{background:var(--orange-t);color:var(--orange-d)}
.chip.green{background:var(--green-t);color:var(--green-d)}
.bar{height:8px;background:var(--grey-t);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar>i{display:block;height:100%;background:var(--violet);border-radius:99px;transition:width .3s}
.case-card{display:flex;flex-direction:column;gap:6px}
.case-card .ico{font-size:1.6rem}
.case-card h3{margin:0}
.case-card .foot{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.howto{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.howto li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
.howto li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;font-size:.85rem;display:grid;place-items:center}
.callout{border-left:6px solid var(--orange);background:var(--orange-t);border-radius:12px;padding:12px 16px}
.callout.violet{border-color:var(--violet);background:var(--violet-t)}
.callout.green{border-color:var(--green);background:var(--green-t)}
.field{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=text],textarea{font:inherit;border:2px solid var(--line);border-radius:12px;padding:9px 14px;background:#fff;color:var(--ink);width:100%}
input[type=text]:focus,textarea:focus{border-color:var(--violet);outline:none}
.field input[type=text]{max-width:340px}
textarea{min-height:84px;resize:vertical}

/* Stepper ---------------------------------------------------------------- */
.stepper{list-style:none;display:flex;gap:6px;padding:0;margin:0 0 16px;overflow-x:auto}
.stepper li{flex:1 0 auto}
.stepper a{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--surface);border:2px solid var(--line);text-decoration:none;color:var(--ink);font-size:.82rem;font-weight:600;white-space:nowrap}
.stepper a .n{width:22px;height:22px;border-radius:50%;background:var(--grey-t);display:grid;place-items:center;font-size:.75rem}
.stepper a.done .n{background:var(--green);color:#fff}
.stepper a[aria-current=step]{border-color:var(--violet);background:var(--violet-t)}
.stepper a[aria-current=step] .n{background:var(--violet);color:#fff}
.stepnav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}

/* Briefing + tagging ----------------------------------------------------- */
.msg{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.msg:first-of-type{border-top:0}
.avatar{flex:none;width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.msg:nth-of-type(3n+2) .avatar{background:var(--violet)}
.msg:nth-of-type(3n) .avatar{background:var(--orange);color:var(--ink)}
.msg .who{margin:0 0 2px;font-size:.9rem;color:var(--muted)}
.msg .who strong{color:var(--ink)}
.msg .body{margin:0;line-height:1.75}
.ph{font:inherit;color:inherit;background:none;border:0;border-bottom:2px dashed var(--violet);padding:1px 2px;cursor:pointer;text-align:left;border-radius:4px}
.ph:hover{background:var(--violet-t)}
.ph.active{background:var(--violet-t);box-shadow:0 0 0 3px var(--violet)}
.ph.tagged{border-bottom-style:solid}
.ph.static{cursor:default}
.ph.static:hover{background:none}
.tag-chip{display:inline-block;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:999px;padding:1px 8px;margin:0 3px;vertical-align:1px}
.t-p{--tc:var(--orange);--tt:var(--orange-t);--td:var(--orange-d)}
.t-o{--tc:var(--violet);--tt:var(--violet-t);--td:var(--violet-d)}
.t-s{--tc:var(--blue);--tt:var(--blue-t);--td:var(--blue-d)}
.t-d{--tc:var(--green);--tt:var(--green-t);--td:var(--green-d)}
.t-c{--tc:var(--amber);--tt:var(--amber-t);--td:var(--amber-d)}
.t-n{--tc:var(--grey);--tt:var(--grey-t);--td:var(--grey-d)}
.ph.tagged{border-bottom-color:var(--tc);background:var(--tt)}
.tag-chip{background:var(--tt);color:var(--td);border:1px solid var(--tc)}
.tagbar{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tagbtn{font:inherit;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tagbtn b{color:var(--td);font-size:.92rem}
.tagbtn span{font-size:.8rem;color:var(--muted);line-height:1.35}
.tagbtn:not([disabled]):hover{border-color:var(--tc);background:var(--tt)}
.tagbtn.cur{border-color:var(--tc);background:var(--tt)}
.tagbtn[disabled]{cursor:default;opacity:.8}
.selbox{background:var(--violet-t);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:.95rem}

/* Options ---------------------------------------------------------------- */
.opts{display:grid;gap:10px;margin:14px 0}
.opt{display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px 16px;cursor:pointer}
.opt:hover{border-color:var(--violet)}
.opt.on{border-color:var(--violet);background:var(--violet-t)}
.opt.dis{opacity:.5;cursor:not-allowed}
.opt input{margin-top:5px;accent-color:var(--violet);width:18px;height:18px;flex:none}
.opt:focus-within{outline:3px solid var(--violet);outline-offset:2px}
.hint{margin-top:10px}
.hintbox{background:var(--amber-t);border-left:6px solid var(--amber);border-radius:12px;padding:10px 16px;margin-top:10px}
.roles{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.rpill{display:inline-flex}
.rpill input{position:absolute;opacity:0;width:1px;height:1px}
.rpill span{border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-size:.88rem;font-weight:500;cursor:pointer;background:#fff}
.rpill:hover span{border-color:var(--violet)}
.rpill input:checked+span{background:var(--violet);border-color:var(--violet);color:#fff;font-weight:600}
.rpill input:focus-visible+span{outline:3px solid var(--violet);outline-offset:2px}
fieldset.stake{border:0;border-top:1px solid var(--line);margin:0;padding:14px 0}
fieldset.stake:first-of-type{border-top:0}
fieldset.stake legend{padding:0;font-size:1rem}
.rolelegend{display:grid;gap:6px 18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));font-size:.85rem;color:var(--muted);margin-bottom:8px}
.rolelegend b{color:var(--ink)}

/* Review / results ------------------------------------------------------- */
dl.sum{margin:0;display:grid;gap:14px}
dl.sum dt{font-weight:700;display:flex;justify-content:space-between;gap:8px}
dl.sum dd{margin:2px 0 0;color:var(--ink)}
dl.sum .none{color:var(--red-d);font-weight:600}
.locked{text-align:center;padding:30px 24px}
.locked .big{font-size:2.6rem;margin-bottom:4px}
.score{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.score .num{font-size:3.4rem;font-weight:800;line-height:1;color:var(--violet-d)}
.score .num small{font-size:1.2rem;color:var(--muted);font-weight:600}
table.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
table.tbl th,table.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl td.r,table.tbl th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.tbl tr.total td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0}
.rev{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.rev li{border:2px solid var(--line);border-radius:14px;padding:12px 16px;background:#fff}
.rev li.best{border-color:var(--green);background:var(--green-t)}
.rev li.mine.wrong{border-color:var(--red-d);background:var(--red-t)}
.rev p{margin:0 0 4px}
.rev .why{font-size:.9rem;color:var(--muted)}
.rev-h{display:flex;gap:6px;margin-bottom:4px;min-height:0}
.badge{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:999px;padding:2px 10px}
.badge.good{background:var(--green);color:#fff}
.badge.you{background:var(--ink);color:#fff}
.mark{font-weight:700}
.mark.ok{color:var(--green-d)}
.mark.bad{color:var(--red-d)}
.brief{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.brief>div{border:2px solid var(--ink);border-radius:14px;padding:12px 16px;background:#fff}
.brief h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--violet-d);margin-bottom:4px}
.brief p{margin:0;font-size:.95rem}
ul.plain{margin:0;padding-left:20px}
ul.plain li{margin:4px 0}

/* KPI Lab ------------------------------------------------------------------ */
.formula{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0;font-weight:600}
.formula b{min-width:64px}
.fc{font-style:normal;background:var(--orange-t);border:2px solid var(--orange);border-radius:12px;padding:4px 12px;font-size:.92rem}
.fc.v{background:var(--violet-t);border-color:var(--violet)}
.deck{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));margin:14px 0 20px}
.gridlist{display:grid;gap:12px;margin:14px 0 20px}
.kcard{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;justify-content:space-between;box-shadow:4px 4px 0 var(--ink)}
.kcard.done{border-color:var(--violet);box-shadow:4px 4px 0 var(--violet)}
.kcard .kt{font-weight:600;line-height:1.4}
.gridlist .kcard{box-shadow:none;border-width:2px}
.slotcard{padding-bottom:16px}
.slot{margin:16px 0 4px}
.slotlabel{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--violet-d);margin:0 0 6px}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.pcard{position:relative;display:flex;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;min-height:62px;font-weight:500;line-height:1.35}
.pcard input{position:absolute;opacity:0;width:1px;height:1px}
.pcard:hover{border-color:var(--violet)}
.pcard.on{border-color:var(--violet);background:var(--violet-t);box-shadow:3px 3px 0 var(--violet)}
.pcard:focus-within{outline:3px solid var(--violet);outline-offset:2px}
.stack{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px;padding:10px 12px;background:var(--bg);border-radius:12px;font-size:.9rem}
.stack .got{background:var(--violet-t);border:2px solid var(--violet);border-radius:10px;padding:2px 10px;font-weight:600}
.stack .empty{border:2px dashed var(--line);border-radius:10px;padding:2px 10px;color:var(--muted)}
.badkpi{margin:0 0 6px}
.badkpi .bad{font-size:1.3rem;font-weight:700;margin:6px 0 4px;padding:12px 16px;border-left:6px solid var(--orange);background:var(--orange-t);border-radius:12px}
.tlabel{display:block;margin-bottom:8px}
.mapcard{padding:14px 14px 18px}
.mapcard svg{width:100%;height:auto;display:block;background:#FBF8F1;border:2px dashed var(--line);border-radius:14px}
.trail{fill:none;stroke:var(--ink);stroke-width:5;stroke-dasharray:1 13;stroke-linecap:round}
.loop{fill:none;stroke:var(--orange-d);stroke-width:3;stroke-dasharray:8 7}
.looplbl{font-size:15px;font-weight:600;fill:var(--orange-d)}
.stop{cursor:pointer;outline:none}
.stop circle{fill:#fff;stroke:var(--ink);stroke-width:4}
.stop:hover circle{fill:var(--violet-t)}
.stop.on circle{fill:var(--violet);stroke:var(--violet-d)}
.stop:focus-visible circle{stroke:var(--violet);stroke-width:7}
.stop .num{font-size:26px;font-weight:800;fill:var(--ink)}
.stop.on .num{fill:#fff}
.stop .lbl{font-size:15px;font-weight:600;fill:var(--ink)}
.bdg.kpi{fill:var(--violet-t);stroke:var(--violet);stroke-width:2}
.bdg.met{fill:var(--orange-t);stroke:var(--orange);stroke-width:2}
.bt{font-size:11px;font-weight:700;fill:var(--ink);letter-spacing:.04em}
.maplegend{display:flex;gap:18px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin:10px 4px}
.bdg-key{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:4px}
.bdg-key.kpi{background:var(--violet-t);border:2px solid var(--violet)}
.bdg-key.met{background:var(--orange-t);border:2px solid var(--orange)}
.stagepanel{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 18px;margin-top:6px}
.stagepanel h3{margin-bottom:6px}

/* KPI type cards (echo the lecture slide) ------------------------------- */
.typegrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:12px 0}
.tcard{background:var(--orange);color:var(--ink);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.tcard .tlab{font-weight:800;font-size:1.15rem;line-height:1.2}
.tcard .tfoc{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--violet);color:#fff;border-radius:12px;padding:3px 12px;align-self:flex-start}
.tcard.ql{background:var(--violet)}.tcard.ql .tlab{color:#fff}.tcard.qc{background:var(--orange)}.tcard.qv{background:var(--green)}.tcard.qv .tlab{color:#fff}.tcard.qn{background:var(--blue)}.tcard.qn .tlab{color:#fff}
.tcard p{margin:0;background:#fff;border-radius:12px;padding:10px 12px;font-size:.92rem;line-height:1.4}
/* Agenda + wrap-up pages ------------------------------------------------------ */
.hubnav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0 8px}
.twotone{position:relative;display:grid;grid-template-columns:1fr 1fr;min-height:150px;border:3px solid var(--ink);border-radius:26px;overflow:hidden;margin-top:6px}
.tt-left{background:#F2F0EC}.tt-right{background:#222222}
.tt-pill{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:999px;padding:14px 44px;box-shadow:0 6px 24px rgba(34,34,34,.18);max-width:92%;text-align:center}
.tt-pill h1{margin:0;font-size:clamp(1.5rem,4vw,2.3rem)}
.tt-sub{text-align:center;color:var(--muted);margin:14px 0 18px}
.progresscard{padding:20px 24px}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{width:100%;height:100%;display:block}
.rbg{fill:none;stroke:var(--grey-t);stroke-width:14}
.rfg{fill:none;stroke:var(--violet);stroke-width:14;stroke-linecap:round;transition:stroke-dasharray .5s}
.rtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.rtxt strong{font-size:2.1rem;font-weight:800}.rtxt span{font-size:.8rem;color:var(--muted)}
.objgrid,.takegrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:10px}
.obj,.take{border-radius:20px;padding:16px 18px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);background:#fff}
.obj h3,.take h3{margin:6px 0 4px}.obj p,.take p{margin:0;font-size:.93rem;color:var(--muted)}
.oi,.ti{font-size:1.9rem;line-height:1}
.o0,.t0{background:var(--violet-t)}.o1,.t1{background:var(--orange-t)}.o2,.t2{background:var(--green-t)}
.timeline{list-style:none;margin:16px 0 20px;padding:0;position:relative}
.timeline::before{content:'';position:absolute;left:28px;top:14px;bottom:14px;width:4px;background:repeating-linear-gradient(to bottom,var(--ink) 0 3px,transparent 3px 13px);opacity:.35}
.stop{position:relative;display:flex;gap:16px;align-items:flex-start;margin:0 0 16px}
.node{flex:none;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;border:4px solid var(--ink);background:#fff;position:relative;z-index:1}
.node.n0{background:var(--violet-t)}.node.n1{background:var(--orange-t)}.node.n2{background:var(--green-t)}
.stopcard{flex:1;margin:0;min-width:0}
.stophead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.stophead h3{margin:0}
.stopnum{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--violet-d)}
.stoplinks{margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.chk{display:flex;gap:14px;align-items:flex-start;border:2px solid var(--line);border-radius:14px;padding:12px 16px;cursor:pointer;background:#fff}
.chk input{margin-top:5px;width:20px;height:20px;accent-color:var(--violet);flex:none}
.chk.on{border-color:var(--green);background:var(--green-t)}
.chk:focus-within{outline:3px solid var(--violet);outline-offset:2px}
.reslist{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.reslist h4{margin:0 0 4px;color:var(--violet-d)}
@media (max-width:640px){.tt-pill{padding:10px 22px}.node{width:46px;height:46px;font-size:1.2rem}.timeline::before{left:21px}}
/* Tableau Lab: product cards + Magic Quadrant ------------------------------ */
.prodgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:12px 0}
.prod{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:4px 4px 0 var(--ink)}
.prod span{font-size:.92rem;color:var(--muted)}
.mapcard svg.q,.mapcard svg[viewBox="0 0 1200 1230"]{max-width:820px;margin:0 auto;background:#fff}
.qbg{stroke:none}.qbg.ql{fill:var(--violet-t)}.qbg.qc{fill:var(--orange-t)}.qbg.qv{fill:var(--green-t)}.qbg.qn{fill:var(--blue-t)}
.qtitle{font-size:26px;font-weight:800;letter-spacing:.06em}.qtitle.ql{fill:var(--violet-d)}.qtitle.qc{fill:var(--orange-d)}.qtitle.qv{fill:var(--green-d)}.qtitle.qn{fill:var(--blue-d)}
.qframe{fill:none;stroke:var(--ink);stroke-width:5}
.axis{font-size:22px;font-weight:700;fill:var(--muted);letter-spacing:.05em}
.vdot{cursor:pointer;outline:none}
.vdot circle{stroke:#fff;stroke-width:3}
.vdot.ql circle{fill:var(--violet)}.vdot.qc circle{fill:var(--orange)}.vdot.qv circle{fill:var(--green)}.vdot.qn circle{fill:var(--blue)}
.vdot.on circle{stroke:var(--ink);stroke-width:5}
.vdot:hover circle{stroke:var(--ink);stroke-width:4}
.vdot:focus-visible circle{stroke:var(--ink);stroke-width:6}
.vlab{font-size:21px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.origfig{margin:14px 0 0}
.origfig img{width:100%;max-width:820px;height:auto;display:block;margin:0 auto;border:2px solid var(--line);border-radius:12px;background:#fff}
.origfig figcaption{text-align:center;margin-top:6px}
/* Photo uploads + team brief ---------------------------------------------- */
.thumbs{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin:12px 0 4px}
.thumb{margin:0;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:8px}
.thumb .zoom{border:0;background:none;padding:0;cursor:zoom-in;border-radius:10px;overflow:hidden;display:block}
.thumb img{width:100%;height:160px;object-fit:cover;display:block;border-radius:10px}
.thumb input[type=text]{font-size:.85rem;padding:6px 10px}
.thumb figcaption{padding:0 4px 4px}
.addtile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:210px;border:3px dashed var(--violet);border-radius:14px;background:var(--violet-t);color:var(--violet-d);font-weight:700;cursor:pointer;text-align:center;padding:12px}
.addtile .plus{font-size:3.4rem;line-height:1}
.addtile input{position:absolute;opacity:0;width:1px;height:1px}
.addtile:hover{background:#fff}
.addtile:focus-within{outline:3px solid var(--violet);outline-offset:2px}
.modal.wide{max-width:940px}
.modal img.big{max-width:100%;height:auto;border-radius:12px;display:block}
.brief-card .brief{margin-top:10px}
/* Modal & toast ----------------------------------------------------------- */
.modal-back{position:fixed;inset:0;background:rgba(34,34,34,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:var(--radius);padding:24px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.modal h2{margin-bottom:.4em}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.modal .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:60}
.err{color:var(--red-d);font-weight:600;font-size:.9rem;min-height:1.4em}
footer{padding:0 0 40px;color:var(--muted);font-size:.8rem;text-align:center}
@media (max-width:640px){.card{padding:18px 16px}.brand span.sub{display:none}.hero .pill{padding:12px 24px}}
</style>

<script>
(function () {
'use strict';

/* ==========================================================================
   CONFIG
   ========================================================================== */
const FACILITATOR_PIN = 'spiced';          // light guard so students don't reveal answers by accident
const HINT_COST = 3;
const SCORE = { evidence: 10, problem: 20, opp: 20, stake: 20, decision: 14, support: 16 };  // = 100
const STORE_KEY = 'bud-game:v1';

/* ==========================================================================
   DATA – cases. {{x|phrase}} marks a taggable phrase; x = correct tag.
   p Problem · o Opportunity · s Stakeholder · d Decision need · c Constraint · n Noise
   ========================================================================== */
const TAGS = {
  p: { label: 'Problem',       def: 'The underlying cause or gap behind the symptoms' },
  o: { label: 'Opportunity',   def: 'The upside if the problem is solved' },
  s: { label: 'Stakeholder',   def: 'Who holds authority or has a stake in the outcome' },
  d: { label: 'Decision need', def: 'The choice someone must make, and by when' },
  c: { label: 'Constraint',    def: 'Limits on data, time, tools or rules' },
  n: { label: 'Noise',         def: 'True, but not useful for this decision' }
};
const ROLES = [
  { id: 'dm',   label: 'Decision-maker', def: 'Has the authority to make the call' },
  { id: 'inf',  label: 'Influencer',     def: 'Shapes or advises the decision' },
  { id: 'aff',  label: 'Affected',       def: 'Lives with the outcome' },
  { id: 'data', label: 'Data provider',  def: 'Owns or supplies the data' },
  { id: 'none', label: 'Not relevant',   def: 'No real role in this decision' }
];
const ROLE_LABEL = Object.fromEntries(ROLES.map(r => [r.id, r.label]));

const CASES = [
/* ---------------------------------------------------------------- MARKETING */
{
  id: 'lumora', industry: 'Marketing', icon: '📣', company: 'Lumora Home',
  tagline: 'Online furniture & décor retailer · €38M annual revenue',
  title: 'More traffic, less revenue',
  setting: 'Lumora Home sells furniture and décor online, with €38M in annual revenue. It’s 20 November. You’ve been asked to “help the marketing team” and have joined this week’s planning thread.',
  messages: [
    { from: 'Priya Nair', role: 'Chief Marketing Officer',
      text: '{{n|Our Instagram just passed 100k followers!}} Still, revenue is down 9% year over year even though we raised ad spend by 12%. I want a dashboard with every campaign metric we have. {{s|I own the €1.4M Q1 marketing budget,}} and {{d|I must decide by 15 December whether to keep pushing paid acquisition or move money elsewhere.}}' },
    { from: 'Tom Becker', role: 'Head of E-commerce',
      text: 'Sessions are up 14%, but {{p|mobile checkout conversion fell from 2.9% to 2.0% after the September app redesign.}} Mobile is 68% of our visits. {{o|Winning back that conversion is worth roughly €3.5M a year.}}' },
    { from: 'Marco Silva', role: 'Customer Support Lead',
      text: 'Tickets saying “payment page freezes” have doubled since September, mostly from people on their phones. My team is swamped and customers are frustrated.' },
    { from: 'Lena Ortiz', role: 'Data Engineer',
      text: '{{c|App tracking only started in October, so earlier app data is patchy.}} Web data is reliable.' }
  ],
  problem: {
    hint: 'Sessions and revenue moved in opposite directions. What could sit between a visit and a sale?',
    options: [
      { t: 'We don’t get enough traffic to our website.', ok: false, why: 'Sessions are actually up 14%. This is the assumption behind the dashboard request, but the numbers in the briefing point elsewhere.' },
      { t: 'Revenue is down 9% year over year.', ok: false, why: 'True, but it is the symptom everyone already knows. A problem statement should explain where and why revenue is leaking.' },
      { t: 'Since the September app redesign, mobile shoppers drop out at checkout, so extra traffic isn’t turning into orders.', ok: true, why: 'Best answer. It names the cause (checkout), the segment (mobile, 68% of visits) and the timing (September), and is backed by Tom’s conversion drop and the doubled support tickets.' },
      { t: 'The marketing team doesn’t have a dashboard for its campaign metrics.', ok: false, why: 'A dashboard is a possible solution, not a business problem. Building it first risks answering the wrong question.' }
    ]
  },
  opp: {
    hint: 'Look for the option tied to a number in the briefing, and to the cause you chose.',
    options: [
      { t: 'Grow the Instagram audience beyond 150k followers.', ok: false, why: 'A vanity metric: followers aren’t connected to revenue anywhere in the briefing.' },
      { t: 'Win back most of the lost mobile conversion, worth roughly €3.5M a year, before spending more on acquisition.', ok: true, why: 'Best answer. It is a measurable gain taken from the briefing (Tom’s estimate) and it fixes the leak before pouring in more traffic.' },
      { t: 'Cut ad spend by 12% to get back to last year’s level.', ok: false, why: 'It reduces cost but does not recover lost revenue, and it treats the ad budget as the issue when traffic is actually up.' },
      { t: 'Build the most complete marketing dashboard in the sector.', ok: false, why: 'A tool for its own sake. An opportunity describes the business upside, not the deliverable.' }
    ]
  },
  stakeholders: {
    hint: 'Ask: who owns the money and makes the call? Who only advises, supplies data, or lives with the result?',
    list: [
      { name: 'Priya Nair', title: 'Chief Marketing Officer', role: 'dm', why: 'Owns the €1.4M budget and must decide by 15 December.' },
      { name: 'Tom Becker', title: 'Head of E-commerce', role: 'inf', why: 'Brings the conversion evidence and shapes what gets fixed, but doesn’t own the budget.' },
      { name: 'Lena Ortiz', title: 'Data Engineer', role: 'data', why: 'Owns the tracking data and knows its gaps.' },
      { name: 'Marco Silva', title: 'Customer Support Lead', role: 'aff', why: 'His team absorbs the ticket surge caused by the checkout problem.' },
      { name: 'Mobile shoppers', title: 'Customers', role: 'aff', why: 'They experience the frozen payment page; success is ultimately measured through them.' }
    ]
  },
  decision: {
    hint: 'A good decision need names the choice, the money involved, and the deadline.',
    options: [
      { t: 'How big the Q1 marketing budget should be.', ok: false, why: 'Not what Priya is deciding: the €1.4M is set. The question is where it goes.' },
      { t: 'Whether to keep funding paid acquisition or divert part of the €1.4M Q1 budget to fixing mobile checkout, decided by 15 December.', ok: true, why: 'Best answer. It names the choice, the money and the deadline, all taken from Priya’s message.' },
      { t: 'Which social platform to post on next.', ok: false, why: 'Unrelated to the revenue problem or to the decision on the table.' },
      { t: 'Which agency should design the next campaign.', ok: false, why: 'Not raised in the briefing; nobody needs to decide this now.' }
    ]
  },
  support: [
    { t: 'Checkout funnel by device and step: conversion before vs. after the September redesign.', ok: true, why: 'Pinpoints where mobile shoppers drop out, the heart of the problem.' },
    { t: 'Revenue-at-risk estimate: what recovering mobile conversion to 2.9% would be worth.', ok: true, why: 'Turns the finding into a number Priya can compare with the ad-budget alternative.' },
    { t: 'A dashboard showing every campaign metric in one view.', ok: false, why: '“Showing all the data” is one of the common dashboard mistakes from the lecture; it doesn’t inform the decision.' },
    { t: 'Follower growth by social platform.', ok: false, why: 'A vanity metric that doesn’t help decide where to put the budget.' },
    { t: 'A benchmark of competitors’ ad spend.', ok: false, why: 'Interesting context, but it doesn’t answer whether money should go to acquisition or to checkout.' }
  ],
  brief: {
    objective: 'Recover about €3.5M of annual revenue by restoring mobile checkout conversion from 2.0% toward 2.9%.',
    situation: 'Sessions +14% but revenue −9%. Mobile is 68% of visits. App tracking is only complete since October. €1.4M Q1 budget; decision due 15 December.',
    goal: 'Find where in the mobile checkout funnel shoppers drop out since the redesign, and estimate the revenue at risk.',
    plan: 'Funnel analysis by device and step (before vs. after September) → revenue-at-risk estimate → recommendation to the CMO on the budget decision. Data: web analytics, app events (from October), support tickets.'
  },
  prompts: [
    'Priya asked for “every campaign metric”. What would you say to her before building anything?',
    'Which numbers in the briefing are metrics, and which one is the KPI?',
    'How would you handle the missing app data before October?'
  ],
  facilitator: [
    'Trap: the stated request (“a dashboard with every metric”) is a solution. Ask which decision the dashboard would support.',
    'Good moment to revisit KPI vs. metric: conversion rate is the KPI; sessions, followers and ticket counts are supporting metrics.',
    'Vanity-metric check: Instagram followers.'
  ]
},
/* --------------------------------------------------------------- HEALTHCARE */
{
  id: 'riverside', industry: 'Healthcare', icon: '🏥', company: 'Riverside General Hospital',
  tagline: '450-bed hospital · busy emergency room',
  title: 'The ER wait that keeps growing',
  setting: 'Riverside General is a 450-bed hospital whose emergency room (ER) is under pressure. You’ve been asked to support the ER team and are collecting input from the people involved.',
  messages: [
    { from: 'Dr. Amira Haddad', role: 'ER Medical Director',
      text: '{{n|We just won a regional staff-satisfaction award, but}} patients are furious: average ER wait rose from 3.1 to 4.4 hours and my nurses are working flat out. I’d like two more triage nurses.' },
    { from: 'Carlos Mendes', role: 'Nursing Manager',
      text: 'Triage still takes 12 minutes, same as last year. But {{p|admitted patients now spend 5.5 hours in the ER waiting for an inpatient bed, and ward discharges mostly happen after 4 pm.}}' },
    { from: 'Sophie Lang', role: 'Chief Operating Officer',
      text: '{{s|I sign off on all staffing and bed-management changes.}} {{d|The board expects waits cut by 30% within 6 months, so I must choose between new triage staff and a bed-flow fix by 1 March.}} {{o|Two hours less boarding would free about 40 ER bed-hours a day.}}' },
    { from: 'Ravi Patel', role: 'Data Analyst',
      text: '{{c|Bed data sits in a separate system that staff update by hand twice a day,}} so by the afternoon it’s often out of date.' }
  ],
  problem: {
    hint: 'Compare what changed (waits) with what did not (triage time). Where else does an ER patient spend time?',
    options: [
      { t: 'The ER doesn’t have enough triage nurses.', ok: false, why: 'Triage time is unchanged at 12 minutes, so triage isn’t where time is lost. This is the proposed solution dressed up as the problem.' },
      { t: 'Average ER wait rose from 3.1 to 4.4 hours.', ok: false, why: 'The symptom the board sees. It says something is wrong, not what is causing it.' },
      { t: 'Admitted patients wait about 5.5 hours in the ER for an inpatient bed, because ward discharges happen late in the day and block ER space.', ok: true, why: 'Best answer. It identifies the bottleneck (boarding), the likely cause (late discharges) and is supported by Carlos’s numbers.' },
      { t: 'Patient satisfaction with the ER is low.', ok: false, why: 'A consequence, not a cause. Working on satisfaction scores directly wouldn’t shorten waits.' }
    ]
  },
  opp: {
    hint: 'Which option links to the board’s target and to a concrete gain mentioned in the briefing?',
    options: [
      { t: 'Win the regional staff-satisfaction award again.', ok: false, why: 'Noise from the briefing; it doesn’t connect to the wait-time target.' },
      { t: 'Cut boarding by two hours, meeting the board’s 30% target and freeing about 40 ER bed-hours a day without new hires.', ok: true, why: 'Best answer. It ties to the board’s target and to a quantified gain from the COO’s message.' },
      { t: 'Replace the bed-management system with a new vendor platform.', ok: false, why: 'Technology-first thinking. It may help later, but nothing yet shows the system itself is the cause.' },
      { t: 'Reduce the workload for all ER staff.', ok: false, why: 'Vague and unmeasurable. A good opportunity states what improves and by how much.' }
    ]
  },
  stakeholders: {
    hint: 'The person who asked for help is not always the person who signs off. Who has that authority here?',
    list: [
      { name: 'Sophie Lang', title: 'Chief Operating Officer', role: 'dm', why: 'Signs off on staffing and bed-management changes, so she makes the call.' },
      { name: 'Dr. Amira Haddad', title: 'ER Medical Director', role: 'inf', why: 'Raised the request and knows ER operations, but the sign-off sits with the COO.' },
      { name: 'Carlos Mendes', title: 'Nursing Manager', role: 'inf', why: 'Frontline evidence about boarding and discharge timing shapes the decision.' },
      { name: 'Ravi Patel', title: 'Data Analyst', role: 'data', why: 'Owns the bed-management data and knows how it’s collected.' },
      { name: 'ER patients', title: 'Patients', role: 'aff', why: 'They live with the waiting time; success is measured through them.' },
      { name: 'Regional award committee', title: 'External body', role: 'none', why: 'Only connected to the noise in the briefing (the award); no role in this decision.' }
    ]
  },
  decision: {
    hint: 'The decision maker has to choose between two courses of action, by a date.',
    options: [
      { t: 'Which triage-nurse candidates to shortlist.', ok: false, why: 'Assumes the solution has already been chosen.' },
      { t: 'Whether to fund extra triage staff or a discharge and bed-flow programme, decided by 1 March.', ok: true, why: 'Best answer. It names the real trade-off and the deadline from Sophie’s message.' },
      { t: 'Whether to extend visiting hours.', ok: false, why: 'Not linked to ER waiting times.' },
      { t: 'How to divide the new-equipment budget across departments.', ok: false, why: 'A different decision, not raised in this briefing.' }
    ]
  },
  support: [
    { t: 'ER stay time split by stage: triage, treatment and boarding.', ok: true, why: 'Shows where the extra 1.3 hours actually accumulate.' },
    { t: 'Discharge times by ward and hour of day.', ok: true, why: 'Tests Carlos’s claim that late discharges block beds.' },
    { t: 'A word cloud of patient satisfaction comments.', ok: false, why: 'Colourful, but it doesn’t help choose between staffing and bed flow.' },
    { t: 'Triage nurses per patient compared with peer hospitals.', ok: false, why: 'Supports the staffing assumption, yet the briefing says triage time hasn’t changed.' },
    { t: 'A dashboard of all hospital KPIs.', ok: false, why: 'Too broad. The decision needs two or three focused analyses, not everything.' }
  ],
  brief: {
    objective: 'Cut average ER wait by 30% (from 4.4 to about 3.1 hours) within 6 months.',
    situation: 'Triage time is unchanged at 12 min. Admitted patients board ~5.5 h waiting for beds; discharges cluster after 4 pm. Bed data is updated by hand twice a day. COO decides by 1 March.',
    goal: 'Quantify where ER time is lost (triage, treatment, boarding) and how discharge timing drives bed availability.',
    plan: 'ER stage-time analysis → discharge-by-hour analysis per ward → scenario: impact of 2 hours less boarding → recommendation for the COO. Coordinate with ER, ward managers and IT (bed data).'
  },
  prompts: [
    'Who is the decision-maker here, and why isn’t it the person who asked for help?',
    'Dr. Haddad proposed hiring nurses. How would you respectfully test that idea with data?',
    'What is the risk of building a live bed-management dashboard first?'
  ],
  facilitator: [
    'Trap: the requester (Dr. Haddad) is not the decision-maker; the COO signs off. Ask who needs to be in the room when results are presented.',
    'Trap: a solution (hire nurses) arrives disguised as a problem. Praise teams that tested it against the unchanged 12-minute triage time.',
    'Link to the lecture’s “Assess the situation” step: manual bed data is a constraint worth flagging early.'
  ]
},
/* ---------------------------------------------------------- HUMAN RESOURCES */
{
  id: 'brightwave', industry: 'Human Resources', icon: '🧑‍💼', company: 'Brightwave Software',
  tagline: '600 employees · large Customer Support team',
  title: 'The exodus nobody can explain',
  setting: 'Brightwave is a 600-person software company with a large Customer Support team. The CEO asked People & Culture to “fix retention”. You’ve joined a call with the people involved.',
  messages: [
    { from: 'Elena Fischer', role: 'CEO',
      text: '{{n|Our Lisbon office opening is on track, but}} attrition jumped from 14% to 22% and the board is watching this number closely. I’m convinced it’s pay. {{s|Nothing in the People budget moves without my approval,}} and {{d|by 30 November I must decide whether to approve an 8% company-wide raise, which costs €2.4M.}}' },
    { from: 'Jamal Reyes', role: 'HR Business Partner',
      text: 'Our salaries sit at the market median. But {{p|58% of leavers came from Customer Support, a team that is only 18% of headcount, and exit interviews say “no path to promotion”.}}' },
    { from: 'Marta Ilic', role: 'Head of Customer Support',
      text: 'We run 24/7, so every gap hurts. Two more agents resigned last week. {{o|Each replacement costs about €9,000; halving Support attrition would save roughly €350k a year.}}' },
    { from: 'David Owusu', role: 'HR Systems Analyst',
      text: '{{c|Exit interviews cover only 40% of leavers, and individual HR data is confidential, so we can only share aggregated numbers.}}' }
  ],
  problem: {
    hint: 'One belief in the briefing is stated as a fact. What do the numbers say about who is actually leaving?',
    options: [
      { t: 'Salaries are too low across the company.', ok: false, why: 'An assumption, not a finding: pay is at the market median. It may play a part, but the data doesn’t show it is the main driver.' },
      { t: 'Attrition rose from 14% to 22%.', ok: false, why: 'A symptom. It says how much, not who is leaving or why.' },
      { t: 'Customer Support staff are leaving because they see no path to promotion, and they account for most of the company’s turnover.', ok: true, why: 'Best answer. It is specific (who and why) and backed by the 58% vs. 18% imbalance and the exit-interview theme.' },
      { t: 'HR lacks a good attrition dashboard.', ok: false, why: 'A tool request, not a business problem.' }
    ]

/* Pre-process the tagging markup ------------------------------------------ */
function parseText(text, counter, correct) {
  const segs = []; let last = 0;
  text.replace(/\{\{([posdcn])\|([\s\S]+?)\}\}/g, (m, tag, v, off) => {
    if (off > last) segs.push({ k: 't', v: text.slice(last, off) });
    segs.push({ k: 'p', idx: counter.n, tag, v }); correct[counter.n] = tag; counter.n++;
    last = off + m.length; return m;
  });
  if (last < text.length) segs.push({ k: 't', v: text.slice(last) });
  return segs;
}
CASES.forEach(c => {
  const ctr = { n: 0 }; c.correct = {};
  c.segs = c.messages.map(m => parseText(m.text, ctr, c.correct));
  c.nPh = ctr.n;
});
const byId = id => CASES.find(c => c.id === id);

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
const initials = n => n.replace(/^Dr\.\s*/, '').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const range = n => Array.from({ length: n }, (_, i) => i);

function newCase(c) {
  return { step: 1, tags: {}, problem: null, problemText: '', opp: null, stake: {}, decision: null, support: [], hints: {}, submitted: false, revealed: false,
    order: {
      problem: shuffle(range(c.problem.options.length)), opp: shuffle(range(c.opp.options.length)),
      decision: shuffle(range(c.decision.options.length)), support: shuffle(range(c.support.length)),
      stake: shuffle(range(c.stakeholders.list.length))
    } };
}
/* Returns the live state object for a case (created on first use). Missing fields, e.g. from an
   older export, are filled in place so references held by event handlers stay valid. */
function getCS(id) {
  const cs = state.cases[id];
  if (!cs) return (state.cases[id] = newCase(byId(id)));
  if (cs.order && cs.tags && cs.stake && cs.hints && Array.isArray(cs.support)) return cs;
  const fresh = newCase(byId(id));
  Object.keys(fresh).forEach(k => { if (cs[k] === undefined || cs[k] === null && k !== 'problem' && k !== 'opp' && k !== 'decision') cs[k] = fresh[k]; });
  return cs;
}

/* ==========================================================================
   SCORING
   ========================================================================== */
function isDone(c, cs, s) {
  switch (s) {
    case 1: return Object.keys(cs.tags).length > 0;
    case 2: return cs.problem != null;
    case 3: return cs.opp != null;
    case 4: return c.stakeholders.list.every((_, i) => cs.stake[i]);
    case 5: return cs.decision != null && cs.support.length === 2;
    case 6: return cs.submitted;
  }
}
const stepsDone = (c, cs) => [1, 2, 3, 4, 5].filter(s => isDone(c, cs, s)).length;
function computeScore(c, cs) {
  const evOk = Object.entries(cs.tags).filter(([i, t]) => c.correct[i] === t).length;
  const stOk = c.stakeholders.list.filter((s, i) => cs.stake[i] === s.role).length;
  const p = {
    evidence: Math.round(SCORE.evidence * evOk / c.nPh),
    problem: cs.problem != null && c.problem.options[cs.problem].ok ? SCORE.problem : 0,
    opp: cs.opp != null && c.opp.options[cs.opp].ok ? SCORE.opp : 0,
    stake: Math.round(SCORE.stake * stOk / c.stakeholders.list.length),
    decision: cs.decision != null && c.decision.options[cs.decision].ok ? SCORE.decision : 0,
    support: cs.support.filter(i => c.support[i].ok).length * (SCORE.support / 2)
  };
  const hints = Object.values(cs.hints).filter(Boolean).length;
  const gross = p.evidence + p.problem + p.opp + p.stake + p.decision + p.support;
  return { parts: p, evOk, stOk, hints, penalty: hints * HINT_COST, total: Math.max(0, gross - hints * HINT_COST) };
}
function totals() {
  let got = 0, max = 0, n = 0;
  CASES.forEach(c => { const cs = getCS(c.id); if (cs.revealed) { got += computeScore(c, cs).total; max += 100; n++; } });
  return { got, max, n };
}

    return `<li><a href="#/bud/${c.id}/${s}" class="${done ? 'done' : ''}" ${s === cur ? 'aria-current="step"' : ''}><span class="n">${done ? '✓' : s}</span>${l}</a></li>`;
  }).join('')}</ol>`;
}
function stepnav(c, s) {
  const back = s === 1 ? `<a class="btn ghost" href="#/bud">← Back to cases</a>` : `<a class="btn ghost" href="#/bud/${c.id}/${s - 1}">← Back</a>`;
  const next = s < 6 ? `<a class="btn primary" href="#/bud/${c.id}/${s + 1}">Next →</a>` : '';
  return `<div class="stepnav">${back}${next}</div>`;
}
function hintBlock(c, cs, field, text) {
  return cs.hints[field]
    ? `<div class="hintbox"><strong>💡 Hint:</strong> ${esc(text)}</div>`
    : `<div class="hint"><button class="btn sm" data-act="hint" data-field="${field}" data-k="hint-${field}">💡 Need a hint? (−${HINT_COST} points)</button></div>`;
}
function optionsHtml(field, opts, order, sel, name) {
  return `<div class="opts" role="radiogroup">${order.map(i => `<label class="opt ${sel === i ? 'on' : ''}"><input type="radio" name="${name}" value="${i}" data-field="${field}" data-k="o-${field}-${i}" ${sel === i ? 'checked' : ''}><span>${esc(opts[i].t)}</span></label>`).join('')}</div>`;
}

/* ---- Steps -------------------------------------------------------------- */
function briefingHtml(c, cs) {
  return c.segs.map((segs, mi) => {
    const m = c.messages[mi];
    const body = segs.map(s => {
      if (s.k === 't') return esc(s.v);
      const t = cs.tags[s.idx];
      return `<button type="button" class="ph ${t ? 'tagged t-' + t : ''} ${ui.activePh === s.idx ? 'active' : ''}" data-act="ph" data-i="${s.idx}" data-k="ph-${s.idx}" aria-pressed="${ui.activePh === s.idx}">${esc(s.v)}</button>${t ? `<span class="tag-chip t-${t}">${TAGS[t].label}</span>` : ''}`;
    }).join('');
    return `<div class="msg"><div class="avatar" aria-hidden="true">${esc(initials(m.from))}</div><div><p class="who"><strong>${esc(m.from)}</strong> · ${esc(m.role)}</p><p class="body">${body}</p></div></div>`;
  }).join('');
}
function step1(c, cs) {
  const act = ui.activePh, has = act != null;
  const seg = has ? c.segs.flat().find(s => s.k === 'p' && s.idx === act) : null;
  const tagged = Object.keys(cs.tags).length;
  const bar = Object.keys(TAGS).map(k => `<button type="button" class="tagbtn t-${k} ${has && cs.tags[act] === k ? 'cur' : ''}" data-act="settag" data-tag="${k}" data-k="tag-${k}" ${has ? '' : 'disabled'}><b>${TAGS[k].label}</b><span>${TAGS[k].def}</span></button>`).join('');
  return `<h2>1. Read the briefing and tag the evidence</h2>
  <p class="lead">Not everything you hear is useful. Tap each <span style="border-bottom:2px dashed var(--violet)">underlined phrase</span> and decide what it is. There are ${c.nPh} to tag.</p>
  <div class="card"><p class="muted" style="margin-bottom:6px">${esc(c.setting)}</p>${briefingHtml(c, cs)}</div>
  <div class="card">
    <div class="selbox" aria-live="polite">${has ? `Selected: <strong>“${esc(seg.v)}”</strong>. Now choose what it is:` : `👆 Select an underlined phrase above, then choose a tag. <strong>${tagged} of ${c.nPh}</strong> tagged so far.`}</div>
    <div class="tagbar">${bar}</div>
    ${has && cs.tags[act] ? `<p style="margin:12px 0 0"><button class="btn sm" data-act="cleartag" data-k="cleartag">Remove this tag</button></p>` : ''}
  </div>`;
}
function step2(c, cs) {
  return `<h2>2. Name the real problem</h2><p class="lead">Which statement best describes the business problem that needs solving?</p>
  ${optionsHtml('problem', c.problem.options, cs.order.problem, cs.problem, 'problem')}
  <label for="ptext"><strong>In your own words</strong> <span class="muted small">(optional, not scored, shared in the debrief)</span></label>
  <textarea id="ptext" data-field="problemText" placeholder="Write the problem in one sentence…">${esc(cs.problemText)}</textarea>
  ${hintBlock(c, cs, 'problem', c.problem.hint)}`;
}
function step3(c, cs) {
  return `<h2>3. Spot the business opportunity</h2><p class="lead">If the problem is solved well, what is the most valuable and realistic upside?</p>
  ${optionsHtml('opp', c.opp.options, cs.order.opp, cs.opp, 'opp')}${hintBlock(c, cs, 'opp', c.opp.hint)}`;
}
function step4(c, cs) {
  const legend = ROLES.map(r => `<div><b>${r.label}:</b> ${r.def}</div>`).join('');
  const rows = cs.order.stake.map(i => {
    const s = c.stakeholders.list[i];
    return `<fieldset class="stake"><legend><strong>${esc(s.name)}</strong> <span class="muted">· ${esc(s.title)}</span></legend><div class="roles">${ROLES.map(r => `<label class="rpill"><input type="radio" name="st-${i}" value="${r.id}" data-field="stake" data-i="${i}" data-k="st-${i}-${r.id}" ${cs.stake[i] === r.id ? 'checked' : ''}><span>${r.label}</span></label>`).join('')}</div></fieldset>`;
  }).join('');
  return `<h2>4. Map the stakeholders</h2><p class="lead">What role does each person or group play in this decision?</p>
  <div class="card" style="margin-bottom:12px"><div class="rolelegend">${legend}</div></div>
  <div class="card">${rows}</div>${hintBlock(c, cs, 'stake', c.stakeholders.hint)}`;
}
function step5(c, cs) {
  const full = cs.support.length >= 2;
  const sup = cs.order.support.map(i => {
    const on = cs.support.includes(i), dis = full && !on;
    return `<label class="opt ${on ? 'on' : ''} ${dis ? 'dis' : ''}"><input type="checkbox" value="${i}" data-field="support" data-k="s-${i}" ${on ? 'checked' : ''} ${dis ? 'disabled' : ''}><span>${esc(c.support[i].t)}</span></label>`;
  }).join('');
  return `<h2>5. Define the decision and the support it needs</h2>
  <p class="lead"><strong>Which decision</strong> does the decision-maker have to make?</p>
  ${optionsHtml('decision', c.decision.options, cs.order.decision, cs.decision, 'decision')}
  <p class="lead" style="margin-top:22px"><strong>Which two analyses</strong> would best support that decision? <span class="chip ${full ? 'green' : 'violet'}">${cs.support.length} of 2 selected</span></p>
  <div class="opts">${sup}</div>${hintBlock(c, cs, 'decision', c.decision.hint)}`;
}

function answersSummary(c, cs, editable) {
  const ed = s => editable ? ` <a class="small" href="#/bud/${c.id}/${s}">Edit</a>` : '';
  const none = '<span class="none">Not answered</span>';
  const stakes = c.stakeholders.list.map((s, i) => `<li>${esc(s.name)} → ${cs.stake[i] ? esc(ROLE_LABEL[cs.stake[i]]) : '<span class="none">?</span>'}</li>`).join('');
  return `<dl class="sum">
    <div><dt><span>Evidence tagged</span>${ed(1)}</dt><dd>${Object.keys(cs.tags).length} of ${c.nPh} phrases</dd></div>
    <div><dt><span>Real problem</span>${ed(2)}</dt><dd>${cs.problem != null ? esc(c.problem.options[cs.problem].t) : none}${cs.problemText ? `<br><em class="muted">“${esc(cs.problemText)}”</em>` : ''}</dd></div>
    <div><dt><span>Opportunity</span>${ed(3)}</dt><dd>${cs.opp != null ? esc(c.opp.options[cs.opp].t) : none}</dd></div>
    <div><dt><span>Stakeholders</span>${ed(4)}</dt><dd><ul class="plain">${stakes}</ul></dd></div>
    <div><dt><span>Decision</span>${ed(5)}</dt><dd>${cs.decision != null ? esc(c.decision.options[cs.decision].t) : none}</dd></div>
    <div><dt><span>Supporting analyses</span>${ed(5)}</dt><dd>${cs.support.length ? `<ul class="plain">${cs.support.map(i => `<li>${esc(c.support[i].t)}</li>`).join('')}</ul>` : none}</dd></div>
  </dl>`;
}
function step6(c, cs) {
  const missing = [1, 2, 3, 4, 5].filter(s => !isDone(c, cs, s));
  return `<h2>6. Review and submit</h2>
  <p class="lead">Check your team’s answers. Once submitted they are locked until the debrief (you can still reopen them before the reveal).</p>
  ${missing.length ? `<div class="callout" style="margin-bottom:14px"><strong>Heads up:</strong> steps ${missing.join(', ')} still have missing answers.</div>` : `<div class="callout green" style="margin-bottom:14px"><strong>All set!</strong> Every step has an answer.</div>`}
  <div class="card">${answersSummary(c, cs, true)}</div>
  <div class="stepnav"><a class="btn ghost" href="#/bud/${c.id}/5">← Back</a>
    <span style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn danger sm" data-act="reset-case">Clear this case</button><button class="btn primary" data-act="submit" data-k="submit">Submit answers ✓</button></span></div>`;
}

function viewStep(c, step) {
  const cs = getCS(c.id); cs.step = step; saveSoon();
  const body = [null, step1, step2, step3, step4, step5, step6][step](c, cs);
  return `<h1 tabindex="-1" style="margin-bottom:.2em">${c.icon} ${esc(c.company)}</h1><p class="muted" style="margin-bottom:14px">${esc(c.industry)} · ${esc(c.title)}</p>
  ${stepper(c, cs, step)}${body}${step < 6 ? stepnav(c, step) : ''}`;
}

/* ---- Results ------------------------------------------------------------ */
function nextCaseLink(c) {
  const i = CASES.indexOf(c), n = CASES[i + 1];
  return n ? `<a class="btn primary" href="${caseHref(n)}">Next case: ${esc(n.company)} →</a>` : `<a class="btn primary" href="#/bud">Back to all cases →</a>`;
}
function revealOptions(field, opts, order, picked) {
  return `<ul class="rev">${order.map(i => {
    const o = opts[i], mine = picked.includes(i);
    return `<li class="${o.ok ? 'best' : ''} ${mine ? 'mine' : ''} ${mine && !o.ok ? 'wrong' : ''}"><div class="rev-h">${o.ok ? '<span class="badge good">Best answer</span>' : ''}${mine ? '<span class="badge you">Your pick</span>' : ''}</div><p>${esc(o.t)}</p><p class="why">${esc(o.why)}</p></li>`;
  }).join('')}</ul>`;
}
function evidenceReview(c, cs) {
  return c.segs.map((segs, mi) => {
    const m = c.messages[mi];
    const body = segs.map(s => {
      if (s.k === 't') return esc(s.v);
      const mine = cs.tags[s.idx], ok = mine === s.tag;
      return `<span class="ph static tagged t-${s.tag}">${esc(s.v)}</span><span class="tag-chip t-${s.tag}">${TAGS[s.tag].label}</span><span class="mark ${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗ ' + (mine ? 'you: ' + TAGS[mine].label : 'untagged')}</span>`;
    }).join('');
    return `<div class="msg"><div class="avatar" aria-hidden="true">${esc(initials(m.from))}</div><div><p class="who"><strong>${esc(m.from)}</strong> · ${esc(m.role)}</p><p class="body">${body}</p></div></div>`;
  }).join('');
}
function viewResults(c) {
  const cs = getCS(c.id);
  const head = `<h1 tabindex="-1" style="margin-bottom:.2em">${c.icon} ${esc(c.company)}</h1><p class="muted" style="margin-bottom:14px">${esc(c.industry)} · ${esc(c.title)}</p>`;
  if (!cs.revealed) {
    return `${head}<div class="card locked"><div class="big" aria-hidden="true">🔒</div><h2>Answers locked in${state.team ? ' for ' + esc(state.team) : ''}</h2>
      <p class="lead">Nice work. Head back to the main room. Feedback and scores are revealed together during the debrief.</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><a class="btn primary" href="#/bud">← Back to all cases</a><button class="btn" data-act="reopen">Edit answers</button>
      ${ui.fac ? '<button class="btn primary" data-act="reveal" data-k="reveal">Reveal answers (facilitator)</button>' : ''}</div></div>
      <div class="card"><h3>Your team’s answers</h3>${answersSummary(c, cs, false)}</div>`;
  }
  const sc = computeScore(c, cs), p = sc.parts;
  const row = (l, g, m) => `<tr><td>${l}</td><td class="r">${g} / ${m}</td></tr>`;
  const stakeRows = c.stakeholders.list.map((s, i) => {
    const ok = cs.stake[i] === s.role;
    return `<tr><td><strong>${esc(s.name)}</strong><br><span class="muted small">${esc(s.title)}</span></td><td>${cs.stake[i] ? esc(ROLE_LABEL[cs.stake[i]]) : '—'}</td><td><span class="mark ${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'}</span> ${esc(ROLE_LABEL[s.role])}</td><td class="small">${esc(s.why)}</td></tr>`;
  }).join('');
  const fac = ui.fac ? `<div class="card callout violet"><h3>Facilitator notes</h3><ul class="plain">${c.facilitator.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : '';
  return `${head}
  <div class="card"><div class="score"><div class="num">${sc.total}<small> / 100</small></div>
    <div style="flex:1;min-width:240px"><table class="tbl" aria-label="Score breakdown"><tbody>
      ${row('Evidence tagging (' + sc.evOk + ' of ' + c.nPh + ' correct)', p.evidence, SCORE.evidence)}${row('Problem', p.problem, SCORE.problem)}${row('Opportunity', p.opp, SCORE.opp)}
      ${row('Stakeholders (' + sc.stOk + ' of ' + c.stakeholders.list.length + ' correct)', p.stake, SCORE.stake)}${row('Decision', p.decision, SCORE.decision)}${row('Supporting analyses', p.support, SCORE.support)}
      ${sc.hints ? `<tr><td>Hints used (${sc.hints})</td><td class="r">−${sc.penalty}</td></tr>` : ''}
      <tr class="total"><td>Total</td><td class="r">${sc.total}</td></tr></tbody></table></div></div></div>

  <div class="card"><h2>1. Evidence</h2><p class="muted small">Correct tag shown for every phrase; ✓ or ✗ marks your team’s tag.</p>${evidenceReview(c, cs)}</div>
  <div class="card"><h2>2. The real problem</h2>${cs.problemText ? `<p class="callout violet"><strong>Your words:</strong> “${esc(cs.problemText)}”</p>` : ''}${revealOptions('problem', c.problem.options, cs.order.problem, cs.problem != null ? [cs.problem] : [])}</div>
  <div class="card"><h2>3. The opportunity</h2>${revealOptions('opp', c.opp.options, cs.order.opp, cs.opp != null ? [cs.opp] : [])}</div>
  <div class="card"><h2>4. The stakeholders</h2><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Who</th><th>Your role</th><th>Best answer</th><th>Why</th></tr></thead><tbody>${stakeRows}</tbody></table></div></div>
  <div class="card"><h2>5. The decision</h2>${revealOptions('decision', c.decision.options, cs.order.decision, cs.decision != null ? [cs.decision] : [])}
    <h3 style="margin-top:20px">Supporting analyses</h3>${revealOptions('support', c.support, cs.order.support, cs.support)}</div>
  <div class="card"><h2>Business understanding brief</h2><p class="muted small">The four tasks of the Business Understanding phase, filled in for this case.</p>
    <div class="brief"><div><h3>Business objective</h3><p>${esc(c.brief.objective)}</p></div><div><h3>Situation &amp; constraints</h3><p>${esc(c.brief.situation)}</p></div>
    <div><h3>Analytics goal</h3><p>${esc(c.brief.goal)}</p></div><div><h3>Project plan</h3><p>${esc(c.brief.plan)}</p></div></div></div>
  <div class="card"><h2>Discussion prompts</h2><ul class="plain">${c.prompts.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
  ${fac}
  <div class="stepnav"><a class="btn ghost" href="#/bud">← Back to all cases</a><span style="display:flex;gap:10px;flex-wrap:wrap">${ui.fac ? '<button class="btn sm" data-act="hide" data-k="hide">Hide answers again</button>' : ''}${nextCaseLink(c)}</span></div>`;
}

/* ==========================================================================
   KPI LAB – 5 stations, 7 team activities ("units").
   Content is declarative: a unit lists steps, a step lists blocks.
   Block types: html · single · multi · grid · slots · text · map · photo · quadrant · memo · brief
   Answers live in state.kpi[unitId].a[blockKey]; scoring is generic (see blockGot).
   ========================================================================== */
const O = (v, t, ok, why) => ({ v, t, ok: !!ok, why: why || '' });   // option
const G = (v, t, ans, why) => ({ v, t, ans, why: why || '' });       // grid item

/* ---- Data analytics workflow (slide 7) ------------------------------------ */
const STAGES = [
  { n: 1, name: 'Business Understanding', lines: ['Business', 'Understanding'], goal: 'Understand the current process and problems', act: 'Speak with stakeholders',

  { n: 2, name: 'Define Solution', lines: ['Define', 'Solution'], goal: 'Set requirements', act: 'Build the solution with a hypothesis',

  { n: 3, name: 'Get Data', lines: ['Get', 'Data'], goal: 'Identify and validate data sources', act: 'Exploratory data analysis (EDA)',

  { n: 4, name: 'Challenge Hypothesis', lines: ['Challenge', 'Hypothesis'], goal: 'Confirm or reject the hypothesis', act: 'Apply statistical and logical analysis',

/* ---- Shared pieces --------------------------------------------------------- */
const FORMULAS = `<div class="card"><h3>The two recipes</h3>
  <div class="formula"><b>Metric</b><span aria-hidden="true">=</span><i class="fc">What you measure</i><span aria-hidden="true">+</span><i class="fc">How you summarise it</i></div>
  <div class="formula"><b>KPI</b><span aria-hidden="true">=</span><i class="fc v">A metric</i><span aria-hidden="true">+</span><i class="fc v">A target</i><span aria-hidden="true">+</span><i class="fc v">A timeframe</i><span aria-hidden="true">+</span><i class="fc v">A strategic goal</i></div>

const FLAGS = [['S', 'Not Specific'], ['M', 'Not Measurable'], ['A', 'Not Achievable'], ['R', 'Not Relevant'], ['T', 'No timeframe'], ['V', 'Vanity metric'], ['O', 'KPI overload'], ['N', 'Nothing wrong: it is already SMART']];
const flagOpts = correct => FLAGS.map(([v, t]) => O(v, t, correct.includes(v)));

/* ---- Bad-KPI repair items (station 2) ------------------------------------- */
function badKpi(n, text, flags, expl, fixes, ptsD, ptsR) {
  return [
    { t: 'html', html: `<div class="badkpi"><span class="chip orange">Draft KPI ${n}</span><p class="bad">“${esc(text)}”</p></div>` },
    { t: 'multi', k: 'd' + n, fixed: true, pts: ptsD, prompt: 'What is wrong with it? Select every problem.', opts: flagOpts(flags), expl },
    { t: 'single', k: 'r' + n, pts: ptsR, prompt: 'Which rewrite fixes it best?', opts: fixes },
    { t: 'text', k: 't' + n, prompt: 'Optional: write your own improved version. Swap with another team for peer review in the debrief.', ph: 'Your rewrite…' }
  ];
}

/* ---- Case KPI builders (station 3) ----------------------------------------- */

    stage: 'Stage 2 · Define Solution', case: caseId,
    recap: () => {

      return `<div class="card"><h3>Where we left off: ${esc(c.company)}</h3><p class="muted small" style="margin-bottom:6px">${esc(c.tagline)}</p>

      { label: 'Supporting metrics', blocks: [
        { t: 'html', html: () => this.recap() + STAGE_NOTE('Stage 2 (Define Solution): list the supporting metrics and the data you will need.') },
        { t: 'multi', k: 'pool', pick: 3, pts: 30, prompt: 'Choose exactly 3 supporting metrics that best help you understand and drive this business goal.', opts: spec.pool }
      ] },
      { label: 'Build the KPI', blocks: [
        { t: 'html', html: STAGE_NOTE('KPI = metric + target + timeframe + strategic goal. Build it from the cards.') },
        { t: 'slots', k: 'kpi', pts: 40, prompt: 'Assemble the KPI that would push this business forward.', slots: [
          { v: 'metric', label: 'The metric', opts: spec.metric }, { v: 'target', label: 'The target', opts: spec.target },
          { v: 'time', label: 'The timeframe', opts: spec.time }, { v: 'goal', label: 'The strategic goal', opts: spec.goal }] }
      ] },
      { label: 'Classify it', blocks: [
        { t: 'single', k: 'type', pts: 15, prompt: 'What type of KPI is the one you built?', opts: spec.type },
        { t: 'single', k: 'lead', pts: 15, prompt: 'Which of these is a leading indicator: something that predicts the KPI rather than reporting what already happened?', opts: spec.lead }
      ] }
    ]; },
    prompts: spec.prompts, fac: spec.fac
  };
}
const TYPE_OPTS = ok => [
  O('strategic', 'Strategic (organisational goals)', ok === 'strategic', ''),
  O('functional', 'Functional (owned by one business unit or team)', ok === 'functional', ''),
  O('operational', 'Operational (a process)', ok === 'operational', '')
];

const UNITS = [
/* ================================================================ STATION 1 */
{

/* ---- Photo upload (sketches) --------------------------------------------------- */
function readImage(file, cb) {
  const fr = new FileReader();
  fr.onerror = () => cb(null);
  fr.onload = () => {
    const img = new Image();
    img.onerror = () => cb(null);
    img.onload = () => {
      const sc = Math.min(1, 1100 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      try { cb(c.toDataURL('image/jpeg', 0.7)); } catch (e) { cb(null); }
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function gallery(unitId, key, editable, max, addLabel) {
  const arr = uOf(unitId).a[key] || [];
  const thumbs = arr.map((p, i) => `<figure class="thumb"><button type="button" class="zoom" data-act="kpi-zoom" data-u="${unitId}" data-b="${key}" data-i="${i}" data-k="zoom-${key}-${i}" aria-label="Enlarge sketch ${i + 1}"><img src="${p.d}" alt="Sketch ${i + 1}${p.c ? ': ' + esc(p.c) : ''}"></button>
    ${editable ? `<input type="text" data-kcap="${key}" data-i="${i}" maxlength="80" value="${esc(p.c || '')}" placeholder="Caption (optional)" aria-label="Caption for sketch ${i + 1}"><button type="button" class="btn sm danger" data-act="kpi-photo-del" data-b="${key}" data-i="${i}" data-k="del-${key}-${i}">Remove</button>` : (p.c ? `<figcaption class="small">${esc(p.c)}</figcaption>` : '')}</figure>`).join('');
  const add = editable && arr.length < max ? `<label class="addtile"><span class="plus" aria-hidden="true">+</span><span>${esc(addLabel || 'Add a photo of your sketch')}</span><span class="small" style="font-weight:500">${arr.length} of ${max} added</span><input type="file" accept="image/*" multiple data-kup="${key}" data-max="${max}" data-k="add-${key}"></label>` : '';
  return `<div class="thumbs">${thumbs}${add}</div>`;
}

}

/* ---- Wrap-up --------------------------------------------------------------------------- */
const TAKEAWAYS = [
  { i: '🎯', t: 'Start with the problem', d: 'No data tool can help if you are solving the wrong problem. Business understanding means goals, problems and opportunities, stakeholders and their decisions.' },

const RESOURCES = [
  ['Business understanding', ['Business Understanding: The vague first step in Data Analysis', 'What is CRISP-DM?']], ['KPIs', ['What is a Key Performance Indicator (KPI)?']],
  ['Business intelligence', ['Business intelligence: A complete overview']], ['Storytelling', ['Storytelling with Data, Part One', 'Storytelling with Data, Part Two (Let’s Practice)', 'Storytelling with Data: Cole Nussbaumer Knaflic, Talks at Google', 'How to turn data into stories']]];
function viewWrap() {
  const w = W(), o = overallProgress(), det = totals(), labs = [['kpi', 'KPI Lab', '#/kpi'], ['bi', 'BI & Storytelling Lab', '#/bi'], ['avo', 'Avocado Case Study', '#/avo'], ['tab', 'Tableau Lab', '#/tab']];
  const rows = [`<tr><td><a href="#/bud">Business Understanding Detective</a></td><td class="r">${det.n ? det.got + ' / ' + det.max : '<span class="muted">not revealed yet</span>'}</td></tr>`]
    .concat(labs.map(([l, name, h]) => { const t = kpiTotals(l); return `<tr><td><a href="${h}">${name}</a></td><td class="r">${t.n ? t.got + ' / ' + t.max : '<span class="muted">not revealed yet</span>'}</td></tr>`; }));
  const all = det.got + labs.reduce((a, l) => a + kpiTotals(l[0]).got, 0), allMax = det.max + labs.reduce((a, l) => a + kpiTotals(l[0]).max, 0);
  const done = HOMEWORK.filter(h => w.checks[h.id]).length;
  const fac = ui.fac ? `<div class="card callout violet"><h3>Facilitator: closing questions</h3><ul class="plain"><li>Which activity changed how you think about KPIs?</li><li>Where in today’s journey did you disagree as a team, and what resolved it?</li><li>What is one thing you will do differently in your next dashboard?</li></ul></div>` : '';
  return heroBand('Wrap-up', 'You made it through the lecture. Here is what to take with you.') + `
  <div class="card progresscard"><div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap">${ringHtml(o.d, o.n)}
    <div style="flex:1;min-width:240px"><h2 style="margin-bottom:4px">${state.team ? esc(state.team) + ': ' : ''}${o.d} of ${o.n} activities submitted</h2><p class="muted" style="margin:0">${o.d < o.n ? 'You can still finish the rest: they stay open on the agenda.' : 'Everything is submitted. Great teamwork!'}</p></div>
    <a class="btn" href="#/agenda">← Back to the agenda</a></div></div>
  <div class="card callout violet" style="margin-top:18px"><div style="display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap"><span><strong>🧠 Test yourselves: the lecture checkpoint</strong><br><span class="small muted">Ten quick questions across everything taught today.</span></span>
    <span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="chip ${uOf('bs5').submitted ? 'green' : 'violet'}">${uOf('bs5').submitted ? 'Submitted' : 'Not submitted yet'}</span><a class="btn primary sm" href="#/bi/bs5/1">${uOf('bs5').submitted ? 'View it' : 'Start the checkpoint'} →</a></span></div></div>
  <h2 style="margin-top:26px">Six things to remember</h2>
  <div class="takegrid">${TAKEAWAYS.map((x, i) => `<div class="take t${i % 3}"><span class="ti" aria-hidden="true">${x.i}</span><h3>${esc(x.t)}</h3><p>${esc(x.d)}</p></div>`).join('')}</div>
  <h2 style="margin-top:30px">Your scoreboard</h2>
  <div class="card"><table class="tbl" aria-label="Scores by activity"><tbody>${rows.join('')}<tr class="total"><td>Total</td><td class="r">${allMax ? all + ' / ' + allMax : '—'}</td></tr></tbody></table>
    <p class="muted small" style="margin:10px 0 0">Scores appear after your facilitator reveals the answers. Unscored workspaces and sketches are for discussion.</p></div>
  <h2 style="margin-top:30px">Before tomorrow <span class="chip ${done === HOMEWORK.length ? 'green' : 'violet'}" style="vertical-align:4px">${done} of ${HOMEWORK.length} done</span></h2>

    ${done === HOMEWORK.length ? '<div class="callout green" style="margin-top:12px"><strong>All set for tomorrow!</strong></div>' : ''}
    <p class="muted small" style="margin:12px 0 0">Tableau Desktop is installed in the next session: there is nothing to install tonight.</p></div>
  <h2 style="margin-top:30px">Tomorrow: data preparation with Tableau</h2>
  <div class="card"><p class="lead" style="margin-bottom:12px">Look at the Tableau Prep page and note your answers. They stay saved in this browser.</p>
    <label for="prep1" class="tlabel"><strong>What is Tableau Prep?</strong></label><textarea id="prep1" data-wf="note" data-id="prep1" placeholder="In your own words…">${esc(w.notes.prep1 || '')}</textarea>
    <label for="prep2" class="tlabel" style="margin-top:14px"><strong>What are the main goals of Tableau Prep?</strong></label><textarea id="prep2" data-wf="note" data-id="prep2" placeholder="In your own words…">${esc(w.notes.prep2 || '')}</textarea></div>
  <h2 style="margin-top:30px">Your take-away</h2>
  <div class="card"><label for="rem" class="tlabel"><strong>One thing I will remember from today</strong></label><textarea id="rem" data-wf="note" data-id="rem" placeholder="…">${esc(w.notes.rem || '')}</textarea>
    <label for="ask" class="tlabel" style="margin-top:14px"><strong>One question I still have</strong></label><textarea id="ask" data-wf="note" data-id="ask" placeholder="…">${esc(w.notes.ask || '')}</textarea></div>
