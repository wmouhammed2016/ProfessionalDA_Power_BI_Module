  <div class="card"><p class="muted small">Titles from the lecture presentation (slide 34). Find the links there.</p><div class="reslist">${RESOURCES.map(([g, l]) => `<div><h4>${esc(g)}</h4><ul class="plain">${l.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div></div>
  ${fac}
  <div class="stepnav"><a class="btn ghost" href="#/agenda">← Back to the agenda</a><span style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn sm" data-act="wrap-copy" data-k="wrapcopy">Copy my summary</button><a class="btn primary" href="#/">Back to the activities →</a></span></div>`;
}
function wrapSummary() {
  const w = W(), det = totals(), lines = ['Lecture 1 wrap-up' + (state.team ? ' – ' + state.team : '')], o = overallProgress();
  lines.push(`Activities submitted: ${o.d} of ${o.n}`);
  if (det.n) lines.push(`Detective: ${det.got}/${det.max}`);
  [['kpi', 'KPI Lab'], ['bi', 'BI & Storytelling Lab'], ['avo', 'Avocado Case Study'], ['tab', 'Tableau Lab']].forEach(([l, n]) => { const t = kpiTotals(l); if (t.n) lines.push(`${n}: ${t.got}/${t.max}`); });
  lines.push('Homework done: ' + (HOMEWORK.filter(h => w.checks[h.id]).map(h => h.t).join('; ') || 'none yet'));
  if (w.notes.rem) lines.push('I will remember: ' + w.notes.rem);
  if (w.notes.ask) lines.push('My question: ' + w.notes.ask);
  return lines.join('\n');
}

/* ==========================================================================
   ROUTER + RENDER
   ========================================================================== */
function route() {
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (p[0] === 'agenda') return { name: 'agenda' };
  if (p[0] === 'wrapup') return { name: 'wrap' };
  if (LABS[p[0]]) {
    const lab = p[0], unit = p[1] && unitById(p[1]); if (!unit || unit.lab !== lab) return { name: 'kpi', lab, menu: true };
    if (p[2] === 'results') return { name: 'kpi', lab, unit, step: 'results' };
    const u = uOf(unit.id), n = unit.steps(u).length + 1; let st = parseInt(p[2], 10);
    if (!(st >= 1 && st <= n)) st = Math.min(u.step || 1, n);
    return { name: 'kpi', lab, unit, step: st };
  }
  if (p[0] !== 'bud') return { name: 'hub' };
  if (!p[1]) return { name: 'act' };
  const c = byId(p[1]); if (!c) return { name: 'act' };
  if (p[2] === 'results') return { name: 'results', c };
  let s = parseInt(p[2], 10); if (!(s >= 1 && s <= 6)) s = getCS(c.id).step || 1;
  return { name: 'step', c, step: s };
}
function render(opts) {
  opts = opts || {};
  const r = route();
  if (r.name === 'kpi') { const to = kpiRedirect(r); if (to) { location.replace(to); return; } }
  if (r.name === 'step' && getCS(r.c.id).submitted) { location.replace('#/bud/' + r.c.id + '/results'); return; }
  if (r.name === 'results' && !getCS(r.c.id).submitted) { location.replace('#/bud/' + r.c.id + '/6'); return; }
  const y = window.scrollY;
  paintToolbar(r);
  const html = r.name === 'agenda' ? viewAgenda() : r.name === 'wrap' ? viewWrap() : r.name === 'kpi' ? kpiView(r) : r.name === 'hub' ? viewHub() : r.name === 'act' ? viewAct() : r.name === 'step' ? viewStep(r.c, r.step) : viewResults(r.c);
  const main = $('#main');
  main.innerHTML = html;
  const name = r.name === 'agenda' ? 'Agenda' : r.name === 'wrap' ? 'Wrap-up' : r.name === 'kpi' ? (r.unit ? r.unit.title : LABS[r.lab].title) : ({ hub: 'Activities', act: 'Business Understanding Detective' }[r.name] || r.c.company);
  document.title = name + ' · Data-Driven Insights';
  if (opts.nav) { window.scrollTo(0, 0); const h = main.querySelector('h1'); if (h) h.focus({ preventScroll: true }); }
  else {
    window.scrollTo(0, y);
    if (opts.restore) { const el = main.querySelector('[data-k="' + opts.restore + '"]'); if (el) el.focus({ preventScroll: true }); }
  }
  paintSaved();
}
const rerender = () => { const a = document.activeElement; render({ restore: a && a.dataset ? a.dataset.k : null }); };
window.addEventListener('hashchange', () => { ui.activePh = null; render({ nav: true }); });

/* ==========================================================================
   EVENTS (delegated)
   ========================================================================== */
const curCase = () => { const r = route(); return r.c ? { c: r.c, cs: getCS(r.c.id) } : null; };

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, cur = curCase();
  switch (act) {
    case 'ph': ui.activePh = ui.activePh === +el.dataset.i ? null : +el.dataset.i; rerender(); break;
    case 'settag': if (cur && ui.activePh != null) { cur.cs.tags[ui.activePh] = el.dataset.tag; ui.activePh = null; save(); rerender(); } break;
    case 'cleartag': if (cur && ui.activePh != null) { delete cur.cs.tags[ui.activePh]; ui.activePh = null; save(); rerender(); } break;
    case 'hint': if (cur) { cur.cs.hints[el.dataset.field] = true; save(); rerender(); } break;
    case 'submit': if (cur) {
      const miss = [1, 2, 3, 4, 5].filter(s => !isDone(cur.c, cur.cs, s));
      const go = () => { cur.cs.submitted = true; save(); closeModal(); location.hash = '#/bud/' + cur.c.id + '/results'; };
      confirmModal('Submit your answers?', miss.length ? `<p>Steps ${miss.join(', ')} still have missing answers. Missing answers score no points.</p><p>You can reopen your answers until the facilitator reveals them.</p>` : '<p>Your answers will be locked until the debrief. You can reopen them until the facilitator reveals them.</p>', 'Submit', go);
    } break;
    case 'reopen': if (cur) { cur.cs.submitted = false; save(); location.hash = '#/bud/' + cur.c.id + '/6'; } break;
    case 'reset-case': if (cur) confirmModal('Clear this case?', '<p>All answers, tags and hints for this case will be removed.</p>', 'Clear case', () => { delete state.cases[cur.c.id]; save(); closeModal(); location.hash = '#/bud/' + cur.c.id + '/1'; render({ nav: true }); }, true); break;
    case 'reveal': if (cur && ui.fac) { cur.cs.revealed = true; save(); rerender(); } break;
    case 'hide': if (cur && ui.fac) { cur.cs.revealed = false; save(); rerender(); } break;
    case 'reveal-all': CASES.forEach(c => { const cs = getCS(c.id); if (cs.submitted) cs.revealed = true; }); save(); rerender(); break;
    case 'hide-all': CASES.forEach(c => { getCS(c.id).revealed = false; }); save(); rerender(); break;
    case 'copy-summary': {
      const lines = ['Business Understanding Detective' + (state.team ? ' – ' + state.team : '')];
      CASES.forEach(c => { const cs = getCS(c.id); if (cs.revealed) lines.push(`${c.industry} (${c.company}): ${computeScore(c, cs).total}/100`); });
      const t = totals(); lines.push(`Total: ${t.got}/${t.max}`); copyText(lines.join('\n')); break;
    }
    case 'timer-toggle': timerToggle(); break;
    case 'timer-reset': timerReset(); closeModal(); break;
    case 'timer-set': openModal(`<h2>Team timer</h2><p class="muted">Pick how long the breakout session should run. The timer is saved in this browser.</p>
        <div class="row">${[15, 20, 25, 30].map(m => `<button class="btn ${T().duration === m * 60 ? 'primary' : ''}" data-act="timer-min" data-m="${m}">${m} min</button>`).join('')}</div>
        <div class="actions"><button class="btn danger" data-act="timer-reset">Reset timer</button><button class="btn" data-act="modal-close">Close</button></div>`); break;
    case 'timer-min': timerSetMinutes(+el.dataset.m); closeModal(); break;
    case 'dismiss-banner': ui.bannerHidden = true; paintBanner(); break;
    case 'fac':
      if (ui.fac) { ui.fac = false; try { sessionStorage.removeItem('bud:fac'); } catch (x) {} paintControls(); rerender(); }
      else openModal(`<h2>Facilitator mode</h2><p class="muted">Enter the facilitator code to reveal answers and see facilitator notes.</p>
        <form data-form="pin"><input type="text" id="pin" autocomplete="off" aria-label="Facilitator code" placeholder="Code"><div class="err" id="pinerr" role="alert"></div>
        <div class="actions"><button type="button" class="btn ghost" data-act="modal-close">Cancel</button><button type="submit" class="btn primary">Unlock</button></div></form>`);
      break;
    case 'data': openModal(`<h2>Save, load or reset</h2><p class="muted">Progress is saved automatically in this browser. Export a backup file to move it to another computer.</p>
        <div class="row"><button class="btn" data-act="export">⬇ Export progress</button><button class="btn" data-act="import">⬆ Import progress</button></div>
        <input type="file" id="importfile" accept="application/json,.json" hidden>
        <div class="err" id="dataerr" role="alert"></div>
        <div class="actions"><button class="btn danger" data-act="reset-all">Reset everything</button><button class="btn" data-act="modal-close">Close</button></div>`); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = 'bud-progress-' + (state.team || 'team').replace(/[^\w-]+/g, '_') + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); break;
    }
    case 'import': $('#importfile').click(); break;
    case 'reset-all': confirmModal('Reset everything?', '<p>This clears the team name, all answers, scores and the timer in this browser. It cannot be undone.</p>', 'Reset everything', () => { state = defaults(); save(); closeModal(); paintControls(); paintBanner(); location.hash = '#/bud'; render({ nav: true }); }, true); break;
    case 'modal-ok': { const cb = confirmModal.cb; if (cb) cb(); break; }
    case 'modal-close': closeModal(); break;
    case 'modal-bg': if (e.target === el) closeModal(); break;
    case 'wrap-copy': copyText(wrapSummary()); break;
    default: if (act.indexOf('kpi-') === 0) kpiClick(act, el);
  }
});

document.addEventListener('change', e => {
  const el = e.target, f = el.dataset.field;
  if (el.dataset.wf === 'check') { W().checks[el.dataset.id] = el.checked; save(); rerender(); return; }
  if (el.dataset.kup) { kpiUpload(el); return; }
  if (el.dataset.kf) { kpiChange(el); return; }
  if (el.id === 'importfile') {
    const file = el.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result); if (!d || d.v !== 1 || typeof d.cases !== 'object') throw new Error('bad');
        state = Object.assign(defaults(), d); state.timer = Object.assign(defaults().timer, d.timer || {});
        save(); closeModal(); paintControls(); paintBanner(); render({ nav: true }); toast('Progress imported');
      } catch (x) { $('#dataerr').textContent = 'That file is not a valid progress export.'; }
    };
    rd.readAsText(file); return;
  }
  const cur = curCase(); if (!f || !cur) return;
  const cs = cur.cs;
  if (f === 'problem' || f === 'opp' || f === 'decision') { cs[f] = +el.value; save(); rerender(); }
  else if (f === 'stake') { cs.stake[el.dataset.i] = el.value; save(); rerender(); }
  else if (f === 'support') {
    const v = +el.value, i = cs.support.indexOf(v);
    if (i >= 0) cs.support.splice(i, 1); else if (cs.support.length < 2) cs.support.push(v);
    save(); rerender();
  }
});
document.addEventListener('input', e => {
  const el = e.target, f = el.dataset.field;
  if (el.dataset.wf === 'note') { W().notes[el.dataset.id] = el.value; saveSoon(); }
  else if (el.dataset.kcap) kpiCaption(el);
  else if (el.dataset.kf && el.dataset.kt === 'text') kpiText(el);
  else if (f === 'team') { state.team = el.value; saveSoon(); }
  else if (f === 'problemText') { const cur = curCase(); if (cur) { cur.cs.problemText = el.value; saveSoon(); } }
});
document.addEventListener('submit', e => {
  if (e.target.dataset.form !== 'pin') return;
  e.preventDefault();
  if ($('#pin').value.trim().toLowerCase() === FACILITATOR_PIN) {
    ui.fac = true; try { sessionStorage.setItem('bud:fac', '1'); } catch (x) {}
    closeModal(); paintControls(); rerender(); toast('Facilitator mode on');
  } else { $('#pinerr').textContent = 'That code isn’t right. Try again.'; }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('g[data-act]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); return; }
  if (e.key === 'Escape') {
    if ($('#modal-root').firstChild) closeModal();
    else if (ui.activePh != null) { ui.activePh = null; rerender(); }
  }
});

/* ==========================================================================
   START
   ========================================================================== */
paintControls(); paintBanner(); paintSaved();
if (T().endsAt && T().endsAt <= Date.now()) { T().endsAt = null; T().left = 0; T().done = true; paintControls(); paintBanner(); }
render({ nav: false });
})();
</script>
