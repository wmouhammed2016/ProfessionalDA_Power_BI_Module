<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power BI · Lecture 1 activities</title>
<!-- Poppins is loaded from Google Fonts when online; the page falls back to system fonts when offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   THEME  (yellow family inspired by the Power BI logo, on a white page.
   Hex values are approximations taken from public brand-colour listings, not an official guide.)
   ========================================================================== */
:root{
  --bg:#FFFFFF;
  --surface:#FFFFFF;
  --canvas:#FAF7EC;       /* warm off-white for inner panels */
  --ink:#1F1F1F;          /* charcoal */
  --muted:#5B5B5B;
  --line:#E6E0CC;
  --yellow:#F2C811;       /* main yellow */
  --yellow-d:#E3A810;     /* darker gold */
  --yellow-dd:#7A5800;    /* dark amber: safe for small text on white */
  --yellow-l:#F9E381;     /* light yellow */
  --yellow-t:#FFF6CC;     /* tint */
  --slate:#605E5C; --slate-t:#F3F2F1;
  --green:#1E8E5A; --green-d:#166B43; --green-t:#E2F4EB;
  --red-d:#B42318; --red-t:#FDECEA;
  --radius:18px;
  --shadow:0 1px 2px rgba(31,31,31,.08),0 8px 24px rgba(31,31,31,.07);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:1.0625rem;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{line-height:1.2;margin:0 0 .5em;font-weight:700;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800}
h2{font-size:1.45rem}
h3{font-size:1.1rem}
p{margin:0 0 .8em}
a{color:var(--yellow-dd);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.9rem}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}
h1:focus,h2:focus{outline:none}
.wrap{max-width:1060px;margin:0 auto;padding:0 16px}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{left:8px}

/* Top bar */
.top{background:var(--bg);border-bottom:4px solid var(--yellow);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
.brand .dots{display:inline-flex;align-items:flex-end;gap:3px;height:20px;flex:none}
.brand .dots i{display:block;width:6px;border-radius:2px}
.brand .dots i:nth-child(1){height:9px;background:var(--yellow-l)}
.brand .dots i:nth-child(2){height:14px;background:var(--yellow)}
.brand .dots i:nth-child(3){height:20px;background:var(--yellow-d)}
.brand span.sub{font-weight:500;color:var(--muted);font-size:.85rem;margin-left:8px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.timer{display:flex;align-items:center;gap:4px;background:var(--ink);color:#fff;border-radius:999px;padding:4px 6px 4px 14px;font-weight:600}
.timer .t{font-variant-numeric:tabular-nums;font-size:1.05rem;min-width:3.4em}
.timer button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:999px;padding:5px 12px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer}
.timer button:hover{background:rgba(255,255,255,.3)}
.timer.warn{background:var(--yellow);color:var(--ink)}
.timer.warn button{background:rgba(31,31,31,.14);color:var(--ink)}
.timer.warn button:hover{background:rgba(31,31,31,.28)}
.banner{background:var(--yellow);color:var(--ink);font-weight:600}
.banner .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-top:10px;padding-bottom:10px}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:14px 0 6px;min-height:22px}
.crumbs{font-size:.85rem;color:var(--muted)}
.crumbs a{color:var(--muted);font-weight:500}
.crumbs b{color:var(--ink);font-weight:600}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:.95rem;padding:9px 18px;border-radius:999px;cursor:pointer;text-decoration:none;transition:transform .08s,background .15s}
.btn:hover{background:var(--slate-t)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--yellow);border-color:var(--ink);color:var(--ink)}
.btn.primary:hover{background:var(--yellow-d)}
.btn.danger{border-color:var(--red-d);color:var(--red-d)}
.btn.danger:hover{background:var(--red-t)}
.btn.ghost{border-color:var(--line);background:transparent}
.btn.ghost:hover{background:var(--canvas)}
.btn.sm{padding:5px 12px;font-size:.82rem}
.btn[disabled],.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.btn.fac-on{background:var(--yellow-t);border-color:var(--yellow-d);color:var(--ink)}

/* Cards / layout */
main{padding:6px 0 60px;outline:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;margin:0 0 18px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.grid .card{margin:0}
.lead{font-size:1.08rem}
.hero{padding:26px 0 8px;text-align:center}
.hero .pill{display:inline-block;background:var(--yellow);border:3px solid var(--ink);border-radius:999px;padding:14px 44px;margin-bottom:12px}
.hero .pill h1{margin:0}
.hero p{color:var(--muted);margin:0}
.chip{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border-radius:999px;padding:2px 10px;background:var(--slate-t);color:var(--slate)}
.chip.gold{background:var(--yellow-t);color:var(--yellow-dd);border:1px solid var(--yellow-d)}
.chip.dark{background:var(--ink);color:#fff}
.chip.green{background:var(--green-t);color:var(--green-d)}
.bar{height:8px;background:var(--slate-t);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar>i{display:block;height:100%;background:var(--yellow-d);border-radius:99px;transition:width .3s}
.case-card{display:flex;flex-direction:column;gap:6px}
.case-card .ico{font-size:1.6rem}
.case-card h3{margin:0}
.case-card .foot{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.howto{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.howto li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
.howto li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);color:var(--ink);font-weight:700;font-size:.85rem;display:grid;place-items:center}
.callout{border-left:6px solid var(--ink);background:var(--slate-t);border-radius:12px;padding:12px 16px}
.callout.gold{border-color:var(--yellow-d);background:var(--yellow-t)}
.callout.green{border-color:var(--green);background:var(--green-t)}
.field{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=text],textarea{font:inherit;border:2px solid var(--line);border-radius:12px;padding:9px 14px;background:#fff;color:var(--ink);width:100%}
input[type=text]:focus,textarea:focus{border-color:var(--ink);outline:none}
.field input[type=text]{max-width:340px}
textarea{min-height:84px;resize:vertical}
.tlabel{display:block;margin-bottom:8px}

/* Stepper */
.stepper{list-style:none;display:flex;gap:6px;padding:0;margin:0 0 16px;overflow-x:auto}
.stepper li{flex:1 0 auto}
.stepper a{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--surface);border:2px solid var(--line);text-decoration:none;color:var(--ink);font-size:.82rem;font-weight:600;white-space:nowrap}
.stepper a .n{width:22px;height:22px;border-radius:50%;background:var(--slate-t);display:grid;place-items:center;font-size:.75rem}
.stepper a.done .n{background:var(--green);color:#fff}
.stepper a[aria-current=step]{border-color:var(--ink);background:var(--yellow-t)}
.stepper a[aria-current=step] .n{background:var(--yellow);color:var(--ink);border:2px solid var(--ink)}
.stepnav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}

/* Options */
.opts{display:grid;gap:10px;margin:14px 0}
.opt{display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px 16px;cursor:pointer}
.opt:hover{border-color:var(--yellow-d)}
.opt.on{border-color:var(--ink);background:var(--yellow-t)}
.opt.dis{opacity:.5;cursor:not-allowed}
.opt input{margin-top:5px;accent-color:var(--ink);width:18px;height:18px;flex:none}
.opt:focus-within{outline:3px solid var(--ink);outline-offset:2px}
.roles{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.rpill{display:inline-flex}
.rpill input{position:absolute;opacity:0;width:1px;height:1px}
.rpill span{border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-size:.88rem;font-weight:500;cursor:pointer;background:#fff}
.rpill:hover span{border-color:var(--yellow-d)}
.rpill input:checked+span{background:var(--yellow);border-color:var(--ink);color:var(--ink);font-weight:700}
.rpill input:focus-visible+span{outline:3px solid var(--ink);outline-offset:2px}

/* Results */
.locked{text-align:center;padding:30px 24px}
.locked .big{font-size:2.6rem;margin-bottom:4px}
.score{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.score .num{font-size:3.4rem;font-weight:800;line-height:1;color:var(--ink);background:linear-gradient(transparent 62%,var(--yellow) 62%)}
.score .num small{font-size:1.2rem;color:var(--muted);font-weight:600}
table.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
table.tbl th,table.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl td.r,table.tbl th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.tbl tr.total td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0}
.rev{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.rev li{border:2px solid var(--line);border-radius:14px;padding:12px 16px;background:#fff}
.rev li.best{border-color:var(--green);background:var(--green-t)}
.rev li.mine.wrong{border-color:var(--red-d);background:var(--red-t)}
.rev p{margin:0 0 4px}
.rev .why{font-size:.9rem;color:var(--muted)}
.rev-h{display:flex;gap:6px;margin-bottom:4px;min-height:0}
.badge{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:999px;padding:2px 10px}
.badge.good{background:var(--green);color:#fff}
.badge.you{background:var(--ink);color:#fff}
.mark{font-weight:700}
.mark.ok{color:var(--green-d)}
.mark.bad{color:var(--red-d)}
ul.plain{margin:0;padding-left:20px}
ul.plain li{margin:4px 0}

/* Sort cards (grid block) */
.deck{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));margin:14px 0 20px}
.gridlist{display:grid;gap:12px;margin:14px 0 20px}
.kcard{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;justify-content:space-between;box-shadow:4px 4px 0 var(--ink)}
.kcard.done{box-shadow:4px 4px 0 var(--yellow-d);background:var(--yellow-t)}
.kcard .kt{font-weight:600;line-height:1.4}
.gridlist .kcard{box-shadow:none}

/* Info cards */
.prodgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:12px 0}
.prod{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:4px 4px 0 var(--yellow-d)}
.prod span{font-size:.92rem;color:var(--muted)}
.prod .pi{font-size:1.7rem;line-height:1}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;font-weight:600}
.flow .fc{background:var(--yellow-t);border:2px solid var(--ink);border-radius:12px;padding:4px 12px;font-size:.92rem}
.probgrid{display:grid;gap:8px 18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin:8px 0 0;padding:0;list-style:none}
.probgrid li{padding-left:22px;position:relative;font-size:.95rem}
.probgrid li::before{content:'✗';position:absolute;left:0;color:var(--red-d);font-weight:800}

/* The pipeline card game */
.game{padding:18px}
.track{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:10px 0 6px}
.endcap{font-weight:700;font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.oslot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:96px;border:3px dashed var(--line);border-radius:16px;background:var(--canvas);font:inherit;color:var(--muted);cursor:pointer;padding:8px;text-align:center}
.oslot:hover{border-color:var(--yellow-d)}
.oslot .onum{width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:.85rem;color:var(--ink)}
.oslot.filled{border-style:solid;border-color:var(--ink);background:var(--yellow);color:var(--ink);box-shadow:4px 4px 0 var(--ink);font-weight:700}
.oslot.filled .onum{border-color:var(--ink)}
.oslot.target{border-color:var(--ink);background:var(--yellow-t)}
.hand{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0 4px;padding:14px;background:var(--canvas);border-radius:14px;min-height:84px;align-items:center}
.hand .empty{color:var(--muted)}
.pk{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;box-shadow:4px 4px 0 var(--ink);color:var(--ink)}
.pk .pi{font-size:1.4rem;line-height:1}
.pk:hover{background:var(--yellow-t)}
.pk.sel{background:var(--yellow);box-shadow:4px 4px 0 var(--yellow-dd);transform:translateY(-3px)}

/* Pipeline map */
.mapcard{padding:14px 14px 18px}
.mapcard svg{width:100%;height:auto;display:block;background:var(--canvas);border:2px dashed var(--line);border-radius:14px}
.trail{fill:none;stroke:var(--ink);stroke-width:5;stroke-dasharray:1 13;stroke-linecap:round}
.stop{cursor:pointer;outline:none}
.stop circle{fill:#fff;stroke:var(--ink);stroke-width:4}
.stop:hover circle{fill:var(--yellow-t)}
.stop.on circle{fill:var(--yellow);stroke:var(--ink)}
.stop:focus-visible circle{stroke-width:8}
.stop .num{font-size:26px;font-weight:800;fill:var(--ink)}
.stop .lbl{font-size:15px;font-weight:600;fill:var(--ink)}
.bdg.back{fill:var(--slate-t);stroke:var(--slate);stroke-width:2}
.bdg.front{fill:var(--yellow-l);stroke:var(--yellow-dd);stroke-width:2}
.bt{font-size:10.5px;font-weight:700;fill:var(--ink);letter-spacing:.03em}
.endlbl{font-size:15px;font-weight:700;fill:var(--muted)}
.maplegend{display:flex;gap:18px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin:10px 4px}
.bdg-key{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:4px}
.bdg-key.back{background:var(--slate-t);border:2px solid var(--slate)}
.bdg-key.front{background:var(--yellow-l);border:2px solid var(--yellow-dd)}
.stagepanel{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 18px;margin-top:6px}
.stagepanel h3{margin-bottom:6px}

/* Agenda + wrap-up */
.hubnav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0 8px}
.twotone{position:relative;display:grid;grid-template-columns:1fr 1fr;min-height:150px;border:3px solid var(--ink);border-radius:26px;overflow:hidden;margin-top:6px}
.tt-left{background:var(--yellow)}.tt-right{background:var(--ink)}
.tt-pill{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border:3px solid var(--ink);border-radius:999px;padding:14px 44px;max-width:92%;text-align:center}
.tt-pill h1{margin:0;font-size:clamp(1.5rem,4vw,2.3rem)}
.tt-sub{text-align:center;color:var(--muted);margin:14px 0 18px}
.progresscard{padding:20px 24px}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{width:100%;height:100%;display:block}
.rbg{fill:none;stroke:var(--slate-t);stroke-width:14}
.rfg{fill:none;stroke:var(--yellow-d);stroke-width:14;stroke-linecap:round;transition:stroke-dasharray .5s}
.rtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.rtxt strong{font-size:2.1rem;font-weight:800}.rtxt span{font-size:.8rem;color:var(--muted)}
.objgrid,.takegrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:10px}
.obj,.take{border-radius:20px;padding:16px 18px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);background:#fff}
.obj h3,.take h3{margin:6px 0 4px}.obj p,.take p{margin:0;font-size:.93rem;color:var(--muted)}
.oi,.ti{font-size:1.9rem;line-height:1}
.o0,.t0{background:var(--yellow-t)}.o1,.t1{background:var(--yellow-l)}.o2,.t2{background:var(--canvas)}
.timeline{list-style:none;margin:16px 0 20px;padding:0;position:relative}
.timeline::before{content:'';position:absolute;left:28px;top:14px;bottom:14px;width:4px;background:repeating-linear-gradient(to bottom,var(--ink) 0 3px,transparent 3px 13px);opacity:.35}
.tstop{position:relative;display:flex;gap:16px;align-items:flex-start;margin:0 0 16px}
.node{flex:none;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;border:4px solid var(--ink);background:#fff;position:relative;z-index:1}
.node.n0{background:var(--yellow-t)}.node.n1{background:var(--yellow-l)}.node.n2{background:var(--canvas)}
.node.brk{background:var(--yellow-l)}
.stopcard{flex:1;margin:0;min-width:0}
.stopcard.live{background:var(--canvas)}
.stophead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.stophead h3{margin:0}
.stopnum{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--yellow-dd)}
.stoplinks{margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.chk{display:flex;gap:14px;align-items:flex-start;border:2px solid var(--line);border-radius:14px;padding:12px 16px;cursor:pointer;background:#fff}
.chk input{margin-top:5px;width:20px;height:20px;accent-color:var(--ink);flex:none}
.chk.on{border-color:var(--green);background:var(--green-t)}
.chk:focus-within{outline:3px solid var(--ink);outline-offset:2px}
.reslist{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.reslist h4{margin:0 0 4px;color:var(--yellow-dd)}
@media (max-width:640px){.tt-pill{padding:10px 22px}.node{width:46px;height:46px;font-size:1.2rem}.timeline::before{left:21px}}

/* Modal & toast */
.modal-back{position:fixed;inset:0;background:rgba(31,31,31,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:var(--radius);padding:24px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.modal h2{margin-bottom:.4em}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.modal .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:60}
.err{color:var(--red-d);font-weight:600;font-size:.9rem;min-height:1.4em}
footer{padding:0 0 40px;color:var(--muted);font-size:.8rem;text-align:center}
@media (max-width:640px){.card{padding:18px 16px}.brand span.sub{display:none}.hero .pill{padding:12px 24px}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#/" aria-label="Professional Data Analyst, Power BI – home"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span>Professional Data Analyst</span><span class="sub">Power BI · Lecture 1</span></a>
    <div class="controls" id="controls"></div>
  </div>
</header>
<div id="banner"></div>

<div class="wrap">
  <nav class="toolbar" id="toolbar" aria-label="Breadcrumb"></nav>
  <main id="main" tabindex="-1"><noscript>This activity needs JavaScript. Please open it in a modern browser.</noscript></main>
  <footer><span id="saved" role="status"></span></footer>
</div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script>
(function () {
'use strict';

/* ==========================================================================
   CONFIG
   ========================================================================== */
const FACILITATOR_PIN = 'insight';          // light guard so students don't reveal answers by accident
const STORE_KEY = 'pbi-l1:v1';
const COURSE = 'Professional Data Analyst';
const LECTURE = 'Power BI · Lecture 1';

/* ==========================================================================
   HELPERS
   ========================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const range = n => Array.from({ length: n }, (_, i) => i);
const O = (v, t, ok, why) => ({ v, t, ok: !!ok, why: why || '' });   // option
const G = (v, t, ans, why) => ({ v, t, ans, why: why || '' });       // grid item

/* ==========================================================================
   STATE + PERSISTENCE (localStorage, with graceful fallback)
   ========================================================================== */
let storageOk = true;
function readStore() { try { const r = localStorage.getItem(STORE_KEY); return r ? JSON.parse(r) : null; } catch (e) { storageOk = false; return null; } }
function defaults() { return { v: 1, team: '', timer: { duration: 600, endsAt: null, left: null, done: false }, units: {}, wrap: { checks: {}, notes: {} } }; }
let state = defaults();
(function init() {
  const loaded = readStore();
  if (loaded && loaded.v === 1) { state = Object.assign(defaults(), loaded); state.timer = Object.assign(defaults().timer, loaded.timer || {}); }
})();
let saveTimer = null;
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); storageOk = true; } catch (e) { storageOk = false; }
  paintSaved();
  return storageOk;
}
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 350); }
function paintSaved() {
  const el = $('#saved');
  el.textContent = storageOk ? '✓ Progress is saved automatically in this browser.' : '⚠ This browser is blocking storage, so progress will be lost when the tab closes.';
}

/* UI-only (not persisted) state */
const ui = { fac: false, bannerHidden: false, mapStop: null, sel: null };
try { ui.fac = sessionStorage.getItem('pbi:fac') === '1'; } catch (e) {}

/* ==========================================================================
   TIMER
   ========================================================================== */
const T = () => state.timer;
function remaining() { return T().endsAt ? Math.max(0, Math.ceil((T().endsAt - Date.now()) / 1000)) : (T().left == null ? T().duration : T().left); }
const running = () => !!T().endsAt;
function timerToggle() {
  if (running()) { T().left = remaining(); T().endsAt = null; }
  else { let l = T().left == null ? T().duration : T().left; if (l <= 0) l = T().duration; T().endsAt = Date.now() + l * 1000; T().done = false; ui.bannerHidden = false; }
  save(); paintControls(); paintBanner();
}
function timerReset() { T().endsAt = null; T().left = null; T().done = false; save(); paintControls(); paintBanner(); }
function timerSetMinutes(m) { T().duration = m * 60; timerReset(); }
function tick() {
  const el = $('#tval'); if (!el) return;
  const r = remaining();
  if (running() && r === 0) { T().endsAt = null; T().left = 0; T().done = true; ui.bannerHidden = false; save(); paintControls(); paintBanner(); return; }
  el.textContent = fmt(r);
  const box = $('#timerbox'); if (box) box.classList.toggle('warn', (running() && r <= 60) || T().done);
}
setInterval(tick, 1000);

/* ==========================================================================
   CHROME (header controls, banner, toolbar), modals, toast
   ========================================================================== */
function paintControls() {
  const r = remaining();
  $('#controls').innerHTML =
    `<div class="timer ${(running() && r <= 60) || T().done ? 'warn' : ''}" id="timerbox" role="group" aria-label="Team timer">
       <span class="t" id="tval">${fmt(r)}</span>
       <button data-act="timer-toggle" data-k="tt">${running() ? 'Pause' : 'Start'}</button>
       <button data-act="timer-set" data-k="ts">Set</button>
     </div>
     <button class="btn sm ${ui.fac ? 'fac-on' : 'ghost'}" data-act="fac" data-k="fac" aria-pressed="${ui.fac}">${ui.fac ? '🔓 Facilitator on' : '🔒 Facilitator'}</button>
     <button class="btn sm ghost" data-act="data" data-k="data">Data</button>`;
}
function paintBanner() {
  $('#banner').innerHTML = T().done && !ui.bannerHidden
    ? `<div class="banner" role="alert"><div class="wrap"><span>⏰ Time’s up! Finish your last answer and head back to the main room.</span><button class="btn sm" data-act="dismiss-banner">Dismiss</button></div></div>` : '';
}
function paintToolbar(r) {
  const home = `<a href="#/">Activities</a>`;
  if (r.name === 'hub') { $('#toolbar').innerHTML = ''; return; }
  if (r.name === 'agenda' || r.name === 'wrap') { $('#toolbar').innerHTML = `<a class="btn sm ghost" href="#/">← Back to activities</a><span class="crumbs">${home} / <b>${r.name === 'agenda' ? 'Agenda' : 'Wrap-up'}</b></span>`; return; }
  const L = LABS[r.lab], lab = `<a href="${L.hash}">${esc(L.title)}</a>`;
  $('#toolbar').innerHTML = r.menu
    ? `<a class="btn sm ghost" href="#/">← Back to activities</a><span class="crumbs">${home} / <b>${esc(L.title)}</b></span>`
    : `<a class="btn sm ghost" href="${L.hash}">← Back to ${esc(L.title)}</a><span class="crumbs">${home} / ${lab} / <b>${esc(r.unit.title)}</b>${r.step === 'results' ? ' / <b>Results</b>' : ''}</span>`;
}
let lastFocus = null;
function openModal(html) {
  lastFocus = document.activeElement;
  $('#modal-root').innerHTML = `<div class="modal-back" data-act="modal-bg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const f = $('#modal-root').querySelector('input,button,textarea'); if (f) f.focus();
}
function closeModal() { $('#modal-root').innerHTML = ''; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
function confirmModal(title, body, okLabel, onOk, danger) {
  openModal(`<h2>${esc(title)}</h2><div>${body}</div><div class="actions"><button class="btn ghost" data-act="modal-close">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" data-act="modal-ok">${esc(okLabel)}</button></div>`);
  confirmModal.cb = onOk;
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; $('#toast-root').appendChild(t);
  setTimeout(() => t.remove(), 2200);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('Copied to clipboard'); }
  catch (e) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); toast('Copied to clipboard'); } catch (e2) { toast('Copy failed'); } a.remove(); }
}

/* ==========================================================================
   CONTENT: the Power BI ecosystem
   Sources: the instructor-supplied transcript of the video "What Is Power BI? The Full Story Visually Explained".
   Scenarios, task cards and wording of the questions were written for this course.
   ========================================================================== */
const SOURCE_NOTE = `<p class="muted small" style="margin:10px 0 0">Based on the course video transcript. The practice scenarios are written for this course. Product facts are the video’s statements: your facilitator verifies them before teaching.</p>`;

/* The five components, in the order of the build */
const STAGES = [
  { n: 1, v: 'pq', name: 'Power Query', icon: '🧹', lines: ['Power', 'Query'], side: 'back', tag: 'Clean',
    job: 'Clean up your data. Remove mistakes and duplicates and fix the formats, so the data is prepared for the next step.' },
  { n: 2, v: 'dm', name: 'Data model', icon: '🧱', lines: ['Data', 'model'], side: 'back', tag: 'Organise',
    job: 'Structure and organise the data: connect your tables to each other. This keeps everything accurate, organised and fast.' },
  { n: 3, v: 'dx', name: 'DAX', icon: '🧮', lines: ['DAX', ''], side: 'back', tag: 'Calculate',
    job: 'Use calculations and math to build the business logic you will need for the visuals.' },
  { n: 4, v: 'vz', name: 'Visuals', icon: '📊', lines: ['Visuals', ''], side: 'front', tag: 'Show',
    job: 'The first time you build something the end user sees: charts, big numbers, tables and filters, to tell a story with the data.' },
  { n: 5, v: 'sh', name: 'Share & publish', icon: '🚀', lines: ['Share &', 'publish'], side: 'front', tag: 'Share',
    job: 'Publish what you have built, so people can view the report, interact with it and make decisions.' }
];
const STAGE_CHOICES = STAGES.map(s => ({ v: s.v, l: s.n + ' · ' + s.name }));

/* ---- Pipeline map (SVG) ----------------------------------------------------- */
function mapHtml() {
  const sel = ui.mapStop, P = [[130, 220], [320, 100], [510, 220], [700, 100], [890, 220]];
  const stops = STAGES.map((s, i) => {
    const [x, y] = P[i], on = sel === i;
    const lbl = s.side === 'front' ? ['WHAT USERS SEE', 140, 'front'] : ['BEHIND THE SCENES', 160, 'back'];
    const bx = x - lbl[1] / 2;
    return `<g class="stop ${on ? 'on' : ''}" role="button" tabindex="0" data-act="pbi-stop" data-i="${i}" data-k="stop-${i}" aria-pressed="${on}" aria-label="Component ${s.n}: ${esc(s.name)}">
      <rect class="hit" x="${x - 76}" y="${y - 42}" width="152" height="162" fill="transparent"/><circle cx="${x}" cy="${y}" r="32"/><text class="num" x="${x}" y="${y + 9}" text-anchor="middle">${s.n}</text>
      <text class="lbl" x="${x}" y="${y + 58}" text-anchor="middle">${esc(s.lines[0])}</text><text class="lbl" x="${x}" y="${y + 76}" text-anchor="middle">${esc(s.lines[1])}</text>
      <rect class="bdg ${lbl[2]}" x="${bx}" y="${y + 86}" width="${lbl[1]}" height="20" rx="10"/><text class="bt" x="${x}" y="${y + 100}" text-anchor="middle">${lbl[0]}</text></g>`;
  }).join('');
  const s = sel != null ? STAGES[sel] : null;
  const panel = s
    ? `<div class="stagepanel"><h3>${s.icon} ${s.n} · ${esc(s.name)}</h3><p style="margin:0">${esc(s.job)}</p></div>`
    : `<div class="stagepanel muted">👆 Tap a numbered stop on the map to see what each component does.</div>`;
  return `<div class="card mapcard"><svg viewBox="0 40 1000 360" role="group" aria-label="The five components of Power BI, in order" xmlns="http://www.w3.org/2000/svg">
      <path class="trail" d="M130,220 C200,80 260,70 320,100 C400,140 440,220 510,220 C580,220 630,70 700,100 C780,130 830,210 890,220"/>
      <text class="endlbl" x="40" y="382">📥 Your data comes in</text><text class="endlbl" x="960" y="382" text-anchor="end">Decisions get made ✅</text>${stops}</svg>
    <div class="maplegend"><span><i class="bdg-key back"></i> Hidden from the end user</span><span><i class="bdg-key front"></i> Seen by the end user</span></div>${panel}</div>`;
}

/* ---- Units ---------------------------------------------------------------------- */
const LABS = {
  pbi: { id: 'pbi', hash: '#/pbi', title: 'Power BI Ecosystem Lab', word: 'Station', stations: [
    { n: 1, title: 'The big picture' }, { n: 2, title: 'The pipeline card game' }, { n: 3, title: 'Desktop, Service and Mobile' },
    { n: 4, title: 'Is Power BI the right fit?' }, { n: 5, title: 'Lecture checkpoint' }],
    intro: () => `<p class="lead">Before you build anything, see the <strong>whole picture</strong>: why companies moved from spreadsheets to Business Intelligence, how a Power BI project flows from raw data to decisions, and which Power BI tool does which job.</p>
      <ol class="howto"><li><span><strong>Why BI?</strong> What goes wrong with spreadsheets, and what BI is.</span></li><li><span><strong>Card game:</strong> deal the five components into the right order, then place the tasks.</span></li><li><span><strong>Ecosystem:</strong> Desktop, the online service and the mobile app.</span></li><li><span><strong>Fit check:</strong> an optional discussion on where Power BI fits.</span></li><li><span><strong>Checkpoint:</strong> five quick questions.</span></li></ol>
      <div class="callout" style="margin-top:16px"><strong>Team play:</strong> one person shares their screen and drives, everyone discusses. Answers are revealed together in the main room. The practice scenarios are written for this course; the product facts come from the course video.</div>` }
};

const U = (id, st, icon, title, tagline, stage, steps, prompts, fac, extra) => Object.assign({ id, lab: 'pbi', station: st, icon, title, tagline, stage, steps, prompts, fac }, extra || {});

const PROBLEMS = [
  { v: 'man', l: 'Manual work' }, { v: 'stale', l: 'Outdated, static data' }, { v: 'vers', l: 'Many versions' }, { v: 'sec', l: 'Weak security' },
  { v: 'rls', l: 'No row-level control' }, { v: 'size', l: 'Too much data' }, { v: 'truth', l: 'No single source of truth' }, { v: 'mod', l: 'Modern data sources' }
];

const UNITS = [
/* ================================================================ STATION 1 */
U('p1', 1, '📉', 'Why Business Intelligence?', 'Spot what goes wrong when analysis lives in spreadsheets, and what BI is.', 'The big picture', () => [
  { label: 'The spreadsheet story', blocks: [{ t: 'html', html: `<p class="lead">Managers need answers fast: <em>which region is falling behind? why are profits dropping? where should we invest next?</em> Without good data they guess. So the company hires an analyst, who often starts in spreadsheets.</p>
    <div class="card"><h3>Where spreadsheet analysis falls apart</h3><ul class="probgrid">
      <li><strong>Manual work:</strong> connecting sources, exporting, merging and cleaning by hand</li><li><strong>Old, static data:</strong> a snapshot that does not update itself</li>
      <li><strong>Modern sources:</strong> cloud systems, APIs and streams are hard to pull in by hand</li><li><strong>Too much data:</strong> big files freeze or crash</li>
      <li><strong>Many versions:</strong> analysts cannot work in the same file at once</li><li><strong>Weak security:</strong> files travel by email with sensitive data</li>
      <li><strong>No row-level control:</strong> you cannot limit who sees which rows</li><li><strong>No single source of truth:</strong> three analysts, three answers</li></ul></div>
    <div class="card callout gold"><h3>Business Intelligence (BI)</h3><p style="margin:0">BI is the <strong>whole process of working with data</strong>: collecting it from the sources, cleaning and preparing it, organising it, and turning it into visuals so people can understand it and make better decisions. Power BI and Tableau are two well-known BI platforms.</p></div>${SOURCE_NOTE}` }] },
  { label: 'Name the problem', blocks: [
    { t: 'grid', k: 'prob', pts: 70, cards: true, prompt: 'Which spreadsheet problem does each situation show?', choices: PROBLEMS, items: [
      G('a1', 'Every Monday an analyst exports files from three systems, merges the sheets and cleans the rows by hand.', 'man', 'The whole process is manual, slow and painful.'),
      G('a2', 'The monthly report reaches managers three weeks after the data was exported, and sales have changed since.', 'stale', 'A spreadsheet is a snapshot: it does not update when new data arrives.'),
      G('a3', 'Three analysts each edit their own copy of the workbook and nobody knows which is current.', 'vers', 'People cannot work in one file at the same time, so copies multiply.'),
      G('a4', 'A workbook full of sensitive company figures is emailed outside the company by mistake.', 'sec', 'Files sent by email can easily end up in the wrong hands.'),
      G('a5', 'Only senior managers should see salary rows, but everyone with the file sees every sheet.', 'rls', 'Spreadsheets cannot limit which people see which rows, so teams make several versions.'),
      G('a6', 'The workbook freezes when the team tries to load millions of rows.', 'size', 'Spreadsheets cannot handle big data well.'),
      G('a7', 'Sales and finance each report a different revenue for last month.', 'truth', 'Different files, different dates and different formulas: there is no single point of truth.'),
      G('a8', 'The company’s data sits in a cloud application that exposes an API, and copying it by hand is impractical.', 'mod', 'Modern systems live in the cloud and provide data through APIs or streams.')] }] },
  { label: 'What is BI?', blocks: [
    { t: 'single', k: 'q1', pts: 15, prompt: 'Which statement about Business Intelligence is the best?', opts: [
      O('a', 'It is the full workflow: collect, clean, organise and visualise data so people can decide', 1, 'BI covers the process from start to finish.'),
      O('b', 'It is only making charts and dashboards', 0, 'Charts are the visible end of a longer process.'),
      O('c', 'It is a spreadsheet add-in', 0, 'BI platforms replace the manual spreadsheet process.'),
      O('d', 'It is a type of database', 0, 'A database is one possible data source.')] },
    { t: 'single', k: 'q2', pts: 15, prompt: 'Where did the ideas behind Power BI start?', opts: [
      O('a', 'In Excel, with tools such as Power Query and Power Pivot', 1, 'Microsoft took the strong parts of Excel and turned them into products for data analysis.'),
      O('b', 'In a database product', 0, 'The video traces it back to Excel.'),
      O('c', 'In a programming language', 0, 'The video traces it back to Excel.'),
      O('d', 'In a web browser', 0, 'The video traces it back to Excel.')] }] }
], ['Which of the eight problems have you seen in a real workplace?', 'Which problem would cost a company the most?', 'Why is “BI is more than charts” an important point for an analyst?'],
['The eight problems come from the course video. The situations in step 2 are practice examples written for this course.', 'If a team confuses weak security with no row-level control: security is about who gets the file, row-level control is about who sees which rows.']),

/* ================================================================ STATION 2 */
U('p2', 2, '🃏', 'The Pipeline Card Game', 'Deal the five components into order, then place the task cards where they belong.', 'The build, from data to decisions', () => [
  { label: 'Meet the five components', blocks: [
    { t: 'html', html: `<p class="lead">Everything you build in Power BI uses five components. The first three are the <strong>background</strong>: nobody sees them. Visuals are the first thing the end user sees.</p><div class="callout gold small"><strong>Read the stops, then play.</strong> Tap each numbered stop to see its job. You will need it in the next step, where the cards come without hints.</div>` },
    { t: 'map' }] },
  { label: 'Deal the pipeline', blocks: [
    { t: 'html', html: `<div class="callout small" style="margin-bottom:12px"><strong>How to play:</strong> tap a card in your hand, then tap the numbered slot where it belongs. Tap a filled slot to take the card back.</div>` },
    { t: 'order', k: 'flow', pts: 50, prompt: 'Deal the five components in the order you would use them to build a report.', cards: STAGES.map(s => ({ v: s.v, t: s.name, icon: s.icon, job: s.job })), answer: STAGES.map(s => s.v) }] },
  { label: 'Place the task cards', blocks: [
    { t: 'grid', k: 'task', pts: 50, cards: true, prompt: 'Which component does each task belong to?', choices: STAGE_CHOICES, items: [
      G('t1', 'Remove duplicate customer rows', 'pq', 'Removing duplicates is cleaning: that is Power Query.'),
      G('t2', 'Change a column of text dates so Power BI treats them as real dates', 'pq', 'Fixing formats is cleaning: that is Power Query.'),
      G('t3', 'Link the Orders table to the Customers table through a shared customer ID', 'dm', 'Connecting tables to each other is the data model.'),
      G('t4', 'Organise the tables so the report stays accurate and fast', 'dm', 'Structuring the tables is the data model.'),
      G('t5', 'Write a calculation for profit margin that every chart can reuse', 'dx', 'Calculations and business logic are DAX.'),
      G('t6', 'Calculate the average order value', 'dx', 'A calculation built on top of the data is DAX.'),
      G('t7', 'Add a bar chart and a big number to a report page', 'vz', 'Charts and big numbers are visuals.'),
      G('t8', 'Add filters so users can explore the data themselves', 'vz', 'Filters and interactivity are part of the visuals users see.'),
      G('t9', 'Publish the finished report so managers can open it', 'sh', 'Publishing is how the report reaches its audience.'),
      G('t10', 'Let colleagues view the report and interact with it to make decisions', 'sh', 'Sharing lets people view, interact and decide.')] }] }
], ['Which component do you think takes the most time in a real project, and why?', 'Which component could you skip, and what would break?', 'Where does your own work today fit on the track?'],
['The five components and their jobs come from the course video. The ten task cards are practice examples written for this course.', 'DAX sits between the model and the visuals: the video describes it as the business logic needed for the visuals.', 'Link back to the spreadsheet problems: each stage replaces one manual step.']),

/* ================================================================ STATION 3 */
U('p3', 3, '🧰', 'Desktop, Service or Mobile?', 'Which Power BI tool does which job, and what lives in a .pbix file.', 'Build, host and share, view', () => [
  { label: 'Three tools, three jobs', blocks: [{ t: 'html', html: `<p class="lead">Power BI is not one thing. These are the three main tools in the ecosystem:</p>
    <div class="flow" aria-hidden="true"><span class="fc">Build in Desktop</span><span>→</span><span class="fc">Publish to the Service</span><span>→</span><span class="fc">View on any device</span></div>
    <div class="prodgrid">
      <div class="prod"><span class="pi" aria-hidden="true">💻</span><strong>Power BI Desktop</strong><span>The app you install on your own PC, where you spend most of your time building: Power Query, the data model, DAX and visuals. It is Windows-only. Everything is stored in one local <code>.pbix</code> file.</span></div>
      <div class="prod"><span class="pi" aria-hidden="true">☁️</span><strong>Power BI Service</strong><span>Where you publish your report. It lives there, and users open it in their browser to view, filter and interact.</span></div>
      <div class="prod"><span class="pi" aria-hidden="true">📱</span><strong>Power BI mobile app</strong><span>For phones and tablets: people who do not have time to open a laptop connect to the same cloud reports.</span></div></div>
    <p class="muted small">The video says there is more in the ecosystem, but these are the three major tools.</p>${SOURCE_NOTE}` }] },
  { label: 'Which tool?', blocks: [
    { t: 'grid', k: 'tool', pts: 60, cards: true, prompt: 'Which Power BI tool fits each situation?', choices: [{ v: 'desk', l: 'Desktop' }, { v: 'serv', l: 'Service' }, { v: 'mob', l: 'Mobile app' }], items: [
      G('d1', 'An analyst cleans the data, builds the model and writes the DAX.', 'desk', 'Desktop is where you build.'),
      G('d2', 'Colleagues open a published report in their browser and filter it.', 'serv', 'The Service hosts reports for users to view and interact with.'),
      G('d3', 'A senior manager wants to check the same report on a tablet.', 'mob', 'The mobile app connects to the reports that live in the cloud.'),
      G('d4', 'A student asks where to install the tool that builds reports. They use Windows.', 'desk', 'Desktop is installed locally on the PC (and is Windows-only).'),
      G('d5', 'You publish the finished report so it lives in the cloud.', 'serv', 'Once published, the report lives in the Service.'),
      G('d6', 'The data, the model and the report are saved together in one local file.', 'desk', 'Desktop saves everything in a single local file.'),
      G('d7', 'A manager on the move interacts with the report on a phone.', 'mob', 'The mobile app lets people interact with reports on phones and tablets.'),
      G('d8', 'The place where finished reports are hosted and shared with end users.', 'serv', 'Hosting and sharing is the job of the Service.')] }] },
  { label: 'The .pbix file', blocks: [
    { t: 'single', k: 'f1', pts: 20, prompt: 'What does the local .pbix file hold?', opts: [
      O('a', 'The data, the model and the report, all in one file on your PC', 1, 'Everything from Desktop is stored in one single local file.'),
      O('b', 'Only the charts', 0, 'It holds the data and the model as well.'),
      O('c', 'Only a link to the cloud', 0, 'It is a real file on your PC.'),
      O('d', 'Only the DAX formulas', 0, 'It holds the whole project.')] },
    { t: 'single', k: 'f2', pts: 20, prompt: 'Why publish to the Service instead of emailing the .pbix file to everyone?', opts: [
      O('a', 'Emailing copies brings back the spreadsheet problems: many versions and weak security', 1, 'Publishing gives people one place to view the report.'),
      O('b', 'Because .pbix files cannot be emailed', 0, 'The file can be shared; the point is that it is a poor way to do it.'),
      O('c', 'Because emailing makes the report faster', 0, 'It does not.'),

    case 'pbi-copy': {
      const lab = curLab(), lines = [LABS[lab].title + (state.team ? ' – ' + state.team : '')];
      labUnits(lab).forEach(x => { const q = uOf(x.id); if (q.revealed && !x.noScore) lines.push(`${x.title}: ${unitScore(x, q).total}/100`); });
      const t = labTotals(lab); lines.push(`Total: ${t.got}/${t.max}`); copyText(lines.join('\n')); break;
    }
  }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case 'timer-toggle': timerToggle(); break;
    case 'timer-reset': timerReset(); closeModal(); break;
    case 'timer-set': openModal(`<h2>Team timer</h2><p class="muted">Pick how long the breakout session should run. The timer is saved in this browser.</p>
        <div class="row">${[5, 10, 15, 20].map(m => `<button class="btn ${T().duration === m * 60 ? 'primary' : ''}" data-act="timer-min" data-m="${m}">${m} min</button>`).join('')}</div>
        <div class="actions"><button class="btn danger" data-act="timer-reset">Reset timer</button><button class="btn" data-act="modal-close">Close</button></div>`); break;
    case 'timer-min': timerSetMinutes(+el.dataset.m); closeModal(); break;
    case 'dismiss-banner': ui.bannerHidden = true; paintBanner(); break;
    case 'fac':
      if (ui.fac) { ui.fac = false; try { sessionStorage.removeItem('pbi:fac'); } catch (x) {} paintControls(); rerender(); }
      else openModal(`<h2>Facilitator mode</h2><p class="muted">Enter the facilitator code to reveal answers and see facilitator notes.</p>
        <form data-form="pin"><input type="text" id="pin" autocomplete="off" aria-label="Facilitator code" placeholder="Code"><div class="err" id="pinerr" role="alert"></div>
        <div class="actions"><button type="button" class="btn ghost" data-act="modal-close">Cancel</button><button type="submit" class="btn primary">Unlock</button></div></form>`);
      break;
    case 'data': openModal(`<h2>Save, load or reset</h2><p class="muted">Progress is saved automatically in this browser. Export a backup file to move it to another computer.</p>
        <div class="row"><button class="btn" data-act="export">⬇ Export progress</button><button class="btn" data-act="import">⬆ Import progress</button></div>
        <input type="file" id="importfile" accept="application/json,.json" hidden>
        <div class="err" id="dataerr" role="alert"></div>
        <div class="actions"><button class="btn danger" data-act="reset-all">Reset everything</button><button class="btn" data-act="modal-close">Close</button></div>`); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = 'powerbi-l1-progress-' + (state.team || 'team').replace(/[^\w-]+/g, '_') + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); break;
    }
    case 'import': $('#importfile').click(); break;
    case 'reset-all': confirmModal('Reset everything?', '<p>This clears the team name, all answers, scores and the timer in this browser. It cannot be undone.</p>', 'Reset everything', () => { state = defaults(); save(); closeModal(); paintControls(); paintBanner(); location.hash = '#/pbi'; render({ nav: true }); }, true); break;
    case 'modal-ok': { const cb = confirmModal.cb; if (cb) cb(); break; }
    case 'modal-close': closeModal(); break;
    case 'modal-bg': if (e.target === el) closeModal(); break;
    case 'wrap-copy': copyText(wrapSummary()); break;
    default: if (act.indexOf('pbi-') === 0) pbiClick(act, el);
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.wf === 'check') { W().checks[el.dataset.id] = el.checked; save(); rerender(); return; }
  if (el.dataset.kf) { unitChange(el); return; }
  if (el.id === 'importfile') {
    const file = el.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result); if (!d || d.v !== 1 || typeof d.units !== 'object') throw new Error('bad');
        state = Object.assign(defaults(), d); state.timer = Object.assign(defaults().timer, d.timer || {});
        save(); closeModal(); paintControls(); paintBanner(); render({ nav: true }); toast('Progress imported');
      } catch (x) { $('#dataerr').textContent = 'That file is not a valid progress export.'; }
    };
    rd.readAsText(file);
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.wf === 'note') { W().notes[el.dataset.id] = el.value; saveSoon(); }
  else if (el.dataset.kf && el.dataset.kt === 'text') { const unit = curUnit(); if (unit) { uOf(unit.id).a[el.dataset.kf] = el.value; saveSoon(); } }
  else if (el.dataset.field === 'team') { state.team = el.value; saveSoon(); }
});
document.addEventListener('submit', e => {
  if (e.target.dataset.form !== 'pin') return;
  e.preventDefault();
  if ($('#pin').value.trim().toLowerCase() === FACILITATOR_PIN) {
    ui.fac = true; try { sessionStorage.setItem('pbi:fac', '1'); } catch (x) {}
    closeModal(); paintControls(); rerender(); toast('Facilitator mode on');
  } else { $('#pinerr').textContent = 'That code isn’t right. Try again.'; }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('g[data-act]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); return; }
  if (e.key === 'Escape') {
    if ($('#modal-root').firstChild) closeModal();
    else if (ui.sel) { ui.sel = null; rerender(); }
  }
});

/* ==========================================================================
   START
   ========================================================================== */
paintControls(); paintBanner(); paintSaved();
if (T().endsAt && T().endsAt <= Date.now()) { T().endsAt = null; T().left = 0; T().done = true; paintControls(); paintBanner(); }
render({ nav: false });
})();
</script>
</body>
</html>
